<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physik</title>
<style>
  :root{--bg:#eef2fa;--panel:#fff;--ink:#1b2440;--muted:#5a6684;--line:#d8def0;--blue:#2f6df6;--blue-d:#1f4fc4;--shadow:0 6px 24px rgba(27,36,64,.10)}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:clamp(16px,1.3vw,20px);line-height:1.5}
  .page{min-height:100dvh;max-width:1000px;margin:0 auto;padding:clamp(1.4rem,4vw,3rem)}
  .back{display:inline-block;color:var(--blue-d);text-decoration:none;font-weight:700;margin-bottom:1rem}
  .back:hover{text-decoration:underline}
  h1{margin:.2rem 0 .3rem;font-size:clamp(1.8rem,4vw,2.8rem)}
  .lead{margin:0;color:var(--muted)}
  h2{font-size:1rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:2.2rem 0 .2rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem;margin-top:1.1rem}
  a.card{display:flex;gap:1.1rem;align-items:center;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:1.2rem 1.35rem;transition:transform .1s,box-shadow .1s}
  a.card:hover{box-shadow:0 10px 30px rgba(27,36,64,.16)}
  a.card:active{transform:translateY(1px)}
  a.card.sm{border-radius:16px;padding:.9rem 1.05rem;gap:.9rem}
  .badge{flex:0 0 auto;width:52px;height:52px;border-radius:14px;background:#eaf1ff;color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.4rem}
  .badge.sm{width:38px;height:38px;border-radius:11px;font-size:1rem}
  .ct{min-width:0}.ctt{font-weight:800;font-size:1.2rem}.ctd{display:block;color:var(--muted);font-size:.9rem;margin-top:.15rem}
  a.card.sm .ctt{font-weight:700;font-size:1.05rem}
</style>
</head>
<body>
  <div class="page">
    <a class="back" href="../">‹ Material</a>
    <h1>Physik</h1>
    <p class="lead">Wähle eine Klasse.</p>
    <div class="grid">
      <a class="card" href="Klasse-6/"><span class="badge">6</span><span class="ct"><span class="ctt">Klasse 6</span><span class="ctd">Wärmelehre, Strom, Magnetismus, Akustik, Optik</span></span></a>
      <a class="card" href="Klasse-8/"><span class="badge">8</span><span class="ct"><span class="ctt">Klasse 8</span><span class="ctd">Optik, Astronomie</span></span></a>
      <a class="card" href="Klasse-9/"><span class="badge">9</span><span class="ct"><span class="ctt">Klasse 9</span><span class="ctd">Mechanik, Druck, Elektrizität</span></span></a>
      <a class="card" href="Klasse-10/"><span class="badge">10</span><span class="ct"><span class="ctt">Klasse 10</span><span class="ctd">Elektromagnetismus, Energie, Kernphysik</span></span></a>
    </div>
  </div>
</body>
</html>
