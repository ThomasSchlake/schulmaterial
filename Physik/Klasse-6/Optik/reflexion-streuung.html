<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6df6'/><circle cx='16' cy='16' r='2.6' fill='%23fff'/><g fill='none' stroke='%23fff' stroke-width='2'><ellipse cx='16' cy='16' rx='10.5' ry='4.6'/><ellipse cx='16' cy='16' rx='10.5' ry='4.6' transform='rotate(60 16 16)'/><ellipse cx='16' cy='16' rx='10.5' ry='4.6' transform='rotate(120 16 16)'/></g></svg>">
<style>
  /* Farbpalette für alle Seiten (Main-Master). Einzelne Seiten dürfen Werte überschreiben. */
  :root{
    --bg:#eef2fa; --panel:#fff; --ink:#1b2440; --muted:#5a6684; --line:#d8def0;
    --blue:#2f6df6; --blue-d:#1f4fc4; --amber:#f2a521; --green:#25b071; --red:#e5533c;
    --sky1:#eaf1ff; --sky2:#f7faff; --shadow:0 6px 24px rgba(27,36,64,.10);
  }
</style>
<title>Lektion</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    font-size:clamp(16px,1.25vw,20px); line-height:1.5}
  .app{height:calc(var(--vh,1vh)*100); display:flex; flex-direction:column; max-width:1080px; margin:0 auto;
    padding:clamp(.6rem,1.6vw,1.1rem); overflow:hidden; position:relative}

  .top{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:.35rem .8rem .45rem; margin-bottom:.5rem}
  .topline{position:relative; display:flex; align-items:center; justify-content:center; min-height:1.9rem}
  .top .home{position:absolute; left:0; top:50%; transform:translateY(-50%); width:30px; height:30px;
    display:flex; align-items:center; justify-content:center; color:var(--blue-d); font-size:1.5rem;
    font-weight:800; text-decoration:none; border-radius:9px; line-height:1}
  .top .home:hover{background:#eef2fb}
  /* Impressum/Datenschutz: Markup kommt beim Bauen aus _legal-links.html (Wurzel) */
  .top .legal{position:absolute; right:0; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:flex-end; gap:.1rem}
  .top .legal a{color:var(--muted); font-size:.68rem; line-height:1.15; text-decoration:none; padding:0 .3rem; border-radius:6px}
  .top .legal a:hover{background:#eef2fb; color:var(--blue-d)}
  .top h1{margin:0; padding:0 2.2rem; font-size:clamp(1.05rem,2.2vw,1.5rem); text-align:center}
  /* Abschnitte als eine Zeile; passen sie nicht, wird waagerecht gescrollt (Wischen, Mausrad, Leiste) */
  .steps{display:flex; flex-wrap:nowrap; gap:.35rem; justify-content:flex-start; justify-content:safe center;
    margin-top:.35rem; overflow-x:auto; overflow-y:hidden; padding:.1rem .2rem .3rem; scrollbar-width:thin;
    scrollbar-color:#c9d3ea transparent; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain}
  .steps::-webkit-scrollbar{height:6px} .steps::-webkit-scrollbar-thumb{background:#c9d3ea; border-radius:3px}
  /* Rand ausblenden, wenn es links oder rechts weitergeht */
  .steps.mehr-l{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1.6rem); mask-image:linear-gradient(90deg,transparent 0,#000 1.6rem)}
  .steps.mehr-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 1.6rem),transparent 100%); mask-image:linear-gradient(90deg,#000 calc(100% - 1.6rem),transparent 100%)}
  .steps.mehr-l.mehr-r{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 1.6rem,#000 calc(100% - 1.6rem),transparent 100%); mask-image:linear-gradient(90deg,transparent 0,#000 1.6rem,#000 calc(100% - 1.6rem),transparent 100%)}
  /* Blätter-Navigation als Pfeile an den Seiten; verschwinden, wenn nicht möglich */
  .navarrow{position:absolute; top:50%; transform:translateY(-50%); z-index:20; width:clamp(38px,4vw,48px);
    height:clamp(38px,4vw,48px); border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.92);
    color:var(--blue-d); font-size:1.7rem; font-weight:800; line-height:1; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; padding:0}
  .navarrow.prev{left:clamp(.1rem,.8vw,.5rem)}
  .navarrow.next{right:clamp(.1rem,.8vw,.5rem)}
  .navarrow:hover:not(:disabled){background:#fff}
  .navarrow:active:not(:disabled){transform:translateY(-50%) scale(.94)}
  .navarrow:disabled{display:none}
  .step{border:1px solid var(--line); background:#f4f7ff; color:var(--muted); border-radius:999px;
    padding:.26rem .7rem; font-size:.8rem; font-weight:700; cursor:pointer; flex:0 0 auto; white-space:nowrap}
  .step.on{background:var(--blue); color:#fff; border-color:var(--blue)}
  .step .n{opacity:.7; margin-right:.35rem}

  .stage{flex:1 1 auto; background:var(--panel); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:clamp(.9rem,2vw,1.4rem); min-height:0; overflow:hidden;
    display:flex; flex-direction:column; position:relative}
  .stage > h2{flex:0 0 auto}
  .stage h2{margin:.1rem 0 .8rem; font-size:clamp(1.2rem,2.4vw,1.6rem)}
  /* Zweispaltig: Simulation links, Text rechts. Fällt bei schmal/hochkant auf Stapel zurück. */
  .split{flex:1 1 auto; min-height:0; display:flex; gap:.85rem; align-items:stretch}
  .col-viz{flex:0 0 57%; min-width:0; overflow-y:auto; display:flex; flex-direction:column; gap:.5rem}
  .col-viz.solo{flex:1 1 auto}
  .col-text{flex:1 1 43%; min-width:0; overflow-y:auto; padding-left:.55rem}
  .col-single{flex:1 1 auto; min-height:0; overflow-y:auto; max-width:72ch; margin:0 auto; width:100%; padding-inline:.55rem}
  .col-text > :first-child, .col-single > :first-child{margin-top:0}
  .split .col-viz > canvas{flex:1 1 auto; height:auto; max-height:none; min-height:170px}
  @media (max-width:820px), (orientation:portrait){
    .top h1{padding:0 4.8rem 0 2.2rem}   /* Platz für Impressum/Datenschutz rechts */
    .split{flex-direction:column; overflow-y:auto; gap:.4rem}
    .col-viz,.col-text{flex:0 0 auto; overflow:visible}
    .split .col-viz > canvas{flex:0 0 auto; height:calc(var(--vh,1vh)*40); max-height:380px; min-height:170px}
  }
  .stage p{margin:.55rem 0}
  .stage b{color:var(--ink)}
  .lead{color:var(--muted)}
  /* Overarrow für Vektornamen (v, a, AB ...): Linie + Pfeilspitze über dem Symbol */
  /* --ovg: gemessener Abstand von der Oberkante der Zeile bis zur Oberkante der Buchstaben (em).
     Der Pfeil sitzt knapp darüber, wie \vec in LaTeX. */
  .ov{position:relative; white-space:nowrap}
  .ov::before{content:""; position:absolute; left:.03em; right:.05em; top:calc(var(--ovg,.4em) - .15em); border-top:.065em solid currentColor; border-radius:.03em}
  .ov::after{content:""; position:absolute; right:.06em; top:calc(var(--ovg,.4em) - .15em - .07em); width:.14em; height:.14em;
    border-top:.065em solid currentColor; border-right:.065em solid currentColor; transform:rotate(45deg)}

  .box{background:var(--sky2); border:1px solid var(--line); border-radius:14px; padding:.9rem 1.1rem; margin:.9rem 0}
  .box.merke{background:#eef4ff; border-color:#cfe0ff}
  .box.merke .lbl{color:var(--blue-d)}
  /* Hefteintrag: was die Klasse abschreibt */
  .heft{background:#fffdf4; border:1px solid #eadfbd; border-left:6px solid #f2a521; border-radius:12px; padding:.9rem 1.2rem; margin:.4rem 0}
  .heft h3{margin:.1rem 0 .5rem; font-size:1.2rem}
  .heft .f{font-size:1.25em; font-weight:800; margin:.35rem 0}
  .heft ul,.heft ol{margin:.3rem 0 .4rem 1.3rem; padding:0}
  .heft li{margin:.15rem 0}
  .heft .bsp{margin-top:.5rem; padding-top:.45rem; border-top:1px dashed #eadfbd}
  .heft svg{display:inline-block; vertical-align:middle}
  .box.frage{background:#fff7e9; border-color:#f2d9a6}
  .box.frage .lbl{color:#b06f00}
  .box.warn{background:#fdecea; border-color:#f3b4ab}
  .box.warn .lbl{color:#b23a26}
  .box.ziel{background:#eafaf1; border-color:#bfe8d1}
  .box.ziel .lbl{color:#1f7a55}
  .box.quizsumme{background:#f4f7ff; border-color:#cfe0ff}
  .box .lbl{font-weight:800; font-size:.8em; letter-spacing:.3px; text-transform:uppercase; display:block; margin-bottom:.2rem}

  canvas.viz{width:100%; height:calc(var(--vh,1vh)*30); max-height:300px; min-height:150px; display:block; border-radius:12px;
    background:linear-gradient(var(--sky2),var(--sky1)); border:1px solid var(--line); touch-action:none}
  canvas.mini{width:100%; height:calc(var(--vh,1vh)*20); max-height:160px; min-height:110px; display:block; border-radius:12px;
    background:linear-gradient(var(--sky2),var(--sky1)); border:1px solid var(--line)}

  .cases{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:.6rem; margin:.7rem 0}
  .case{background:var(--sky2); border:1px solid var(--line); border-radius:14px; padding:.65rem .8rem; font-size:.92em}
  .case h3{margin:.1rem 0 .25rem; font-size:1rem}
  .case .res{margin-top:.5rem; padding-top:.45rem; border-top:1px dashed var(--line); color:var(--ink)}
  .reveal{border:1px solid var(--line); background:#eef2fb; color:var(--ink); border-radius:10px;
    padding:.5rem .9rem; font:inherit; font-weight:700; cursor:pointer; margin-top:.6rem}
  .reveal:active{transform:translateY(1px)}

  .cmp{width:100%; border-collapse:collapse; margin:.7rem 0}
  .cmp th,.cmp td{border:1px solid var(--line); padding:.6rem .85rem; text-align:left; vertical-align:top}
  .cmp thead th{font-size:1.1rem}
  .cmp thead th:nth-child(2){background:#fdeeeb; color:#b23a26}
  .cmp thead th:nth-child(3){background:#fff4e2; color:#9a6300}
  .cmp tbody th{background:var(--sky2); color:var(--muted); font-weight:700; width:26%; font-size:.9em}

  .choices{display:flex; flex-direction:column; gap:.55rem; margin:.8rem 0}
  .choice{text-align:left; border:2px solid var(--line); background:#fff; border-radius:12px;
    padding:.75rem 1rem; font:inherit; color:inherit; cursor:pointer}
  .choice:active{transform:translateY(1px)}
  .choice.right{border-color:var(--green); background:#eafaf1}
  .choice.wrong{border-color:var(--red); background:#fdeeeb}
  .solution{margin-top:.6rem}
  .modes,.presets{display:flex; flex-wrap:wrap; gap:.5rem; margin:.8rem 0}
  .modes button,.presets button{border:1px solid var(--line); background:#f4f7ff; color:var(--ink); border-radius:999px;
    padding:.5rem 1rem; font:inherit; font-weight:700; cursor:pointer}
  .modes button.on,.presets button.on{background:var(--blue); color:#fff; border-color:var(--blue)}
  .modes button:active,.presets button:active{transform:translateY(1px)}
  .presets{gap:.4rem; margin:.5rem 0}
  .presets button{padding:.4rem .8rem; font-size:.92em}
  .ctrl{display:flex; align-items:center; gap:.9rem; margin:.9rem 0 .2rem; background:var(--sky2);
    border:1px solid var(--line); border-radius:12px; padding:.7rem 1rem}
  .ctrl label{font-weight:800; color:var(--blue-d); white-space:nowrap}
  .ctrl input[type=range]{flex:1 1 auto; -webkit-appearance:none; appearance:none; height:10px;
    background:linear-gradient(90deg,#7fb0ff,#e5533c); border-radius:6px; outline:none}
  .ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:30px; height:30px; border-radius:50%;
    background:#fff; border:3px solid var(--blue); box-shadow:var(--shadow); cursor:pointer}
  .ctrl input[type=range]::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:#fff; border:3px solid var(--blue); cursor:pointer}
  .ctrl .val{font-weight:800; color:var(--ink); min-width:5ch; text-align:right}
  .btnrow{display:flex; flex-wrap:wrap; gap:.6rem; margin:.8rem 0}
  /* Alle drei Regler in EINER Reihe, um Höhe für die Abbildung zu sparen */
  .ctrls{display:flex; flex-wrap:nowrap; gap:.4rem; margin:.5rem 0 .2rem}
  .ctrls .ctrl{flex:1 1 0; min-width:0; margin:0; padding:.4rem .55rem; gap:.4rem}
  .ctrls .ctrl label{font-size:.82em; white-space:nowrap}
  .ctrls .ctrl input[type=range]{flex:1 1 24px; min-width:0}
  .ctrls .ctrl .val{min-width:1.5ch}
  /* Winziger Ansichts-Umschalter (Icon), oben rechts auf der Überschriftenzeile */
  .vswitch{position:absolute; top:clamp(.7rem,1.7vw,1.15rem); right:clamp(.7rem,1.7vw,1.15rem); z-index:3;
    display:inline-flex; gap:2px; background:#eef2fb; border:1px solid var(--line); border-radius:9px; padding:2px; margin:0}
  .vswitch button{border:none; background:transparent; border-radius:7px; padding:.12rem .4rem; font-size:1rem;
    line-height:1.1; cursor:pointer; filter:grayscale(.4); opacity:.65}
  .vswitch button.on{background:var(--blue); filter:none; opacity:1}
  .q{margin:.2rem 0 1rem}
  .q + .q{border-top:1px solid var(--line); padding-top:.9rem; margin-top:1rem}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="topline">
      <a class="home" href="../index.html" aria-label="Zur Übersicht">‹</a>
      <h1 id="h1"></h1>
      <span class="legal"><a href="../../../impressum.html">Impressum</a><a href="../../../datenschutz.html">Datenschutz</a></span>
    </div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="stage" id="stage"></div>
  <button class="navarrow prev" id="prev" aria-label="Zurück">‹</button>
  <button class="navarrow next" id="next" aria-label="Weiter">›</button>
</div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);

/* ---------- gemeinsame Bausteine ---------- */
let RAF=0;
function stopRAF(){ if(RAF) cancelAnimationFrame(RAF); RAF=0; }
function fit(c){ const dpr=window.devicePixelRatio||1, W=c.clientWidth||600, H=c.clientHeight||300;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx,W,H}; }
function parts(n,seed,speed){ let r=seed; const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  const a=[]; for(let i=0;i<n;i++){ const ang=rnd()*6.283; a.push({x:0.08+rnd()*0.84,y:0.08+rnd()*0.84,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed}); } return a; }
function move(ps,dt,mx,my){ mx=mx||0.04; my=my||mx; ps.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.x<mx){p.x=mx;p.vx=Math.abs(p.vx);} if(p.x>1-mx){p.x=1-mx;p.vx=-Math.abs(p.vx);}
  if(p.y<my){p.y=my;p.vy=Math.abs(p.vy);} if(p.y>1-my){p.y=1-my;p.vy=-Math.abs(p.vy);} }); }
function ball(ctx,x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.34,0,7); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill(); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function lbl(ctx,x,y,t,size,col,align){ ctx.fillStyle=col||'#3a4256'; ctx.font='700 '+Math.round(size)+'px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y); }
function drawVessel(ctx,box,ps,r,col,title,sub){
  ctx.strokeStyle='#b7c2dc'; ctx.lineWidth=2.5; rr(ctx,box.x,box.y,box.w,box.h,12); ctx.stroke();
  ps.forEach(p=> ball(ctx, box.x+p.x*box.w, box.y+p.y*box.h, r, col));
  lbl(ctx, box.x+box.w/2, box.y-24, title, 18, '#1b2440');
  if(sub) lbl(ctx, box.x+box.w/2, box.y-6, sub, 14, '#5a6684');
}
function energyBar(ctx,x,y,w,frac,col,cap){ ctx.fillStyle='#e7ecf6'; rr(ctx,x,y,w,16,8); ctx.fill();
  ctx.fillStyle=col; rr(ctx,x,y,Math.max(8,w*frac),16,8); ctx.fill();
  lbl(ctx,x,y-14,cap,13,'#5a6684','left'); }
function arrow(ctx,x1,y1,x2,y2,col,wd){ const a=Math.atan2(y2-y1,x2-x1), h=(wd||2)*3.2;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=wd||2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4)); ctx.closePath(); ctx.fill(); }
// Antworten in den Beispielen erst auf Klick zeigen
function revealCases(root){ root.querySelectorAll('.reveal').forEach(b=>b.addEventListener('click',()=>{
  const res=b.nextElementSibling; if(res) res.hidden=false; b.hidden=true; })); }
// Lösung der Transferfragen: ein Reiter je Frage ([data-tf] Knopf, [data-tf-tab] Inhalt), Schritte zum Aufdecken
function transferTabs(root){ revealCases(root);
  const btns=root.querySelectorAll('[data-tf]'), tabs=root.querySelectorAll('[data-tf-tab]');
  const zeig=k=>{ btns.forEach(b=>b.classList.toggle('on', b.dataset.tf===k)); tabs.forEach(t=>{ t.style.display = t.dataset.tfTab===k ? '' : 'none'; }); };
  btns.forEach(b=>b.addEventListener('click',()=>zeig(b.dataset.tf))); zeig('1'); }
// Auswahlfrage: mischt die Antworten, markiert richtig/falsch und zeigt die Loesung.
// Sind alle Fragen beantwortet, erscheint eine Auswertung (erster Versuch zählt). Eine Frage kann
// mit data-hilfe="…" auf die Stelle der Stunde verweisen, die man bei einem Fehler wiederholen sollte.
function quiz(root){ const blocks=[...root.querySelectorAll('.choices')], erst=new Map();
  blocks.forEach(q=>{ const cs=[...q.querySelectorAll('.choice')];
    for(let k=cs.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [cs[k],cs[j]]=[cs[j],cs[k]]; }
    cs.forEach(c=>q.appendChild(c));
    cs.forEach(b=>b.addEventListener('click',()=>{
      cs.forEach(x=>x.classList.remove('right','wrong'));
      const ok=b.dataset.ok==='1'; b.classList.add(ok?'right':'wrong');
      if(!erst.has(q)) erst.set(q,ok);
      const wrap=q.closest('.q')||q.parentElement, sol=wrap&&wrap.querySelector('.solution'); if(sol) sol.hidden=false;
      if(erst.size===blocks.length) auswertung(); })); });
  function auswertung(){ let box=root.querySelector('.quizsumme'); if(!box){ box=document.createElement('div'); box.className='box quizsumme';
      (blocks[blocks.length-1].closest('.q')||blocks[blocks.length-1]).after(box); }
    const n=blocks.length, r=blocks.filter(q=>erst.get(q)).length;
    const hilfen=blocks.filter(q=>!erst.get(q)).map((q,k)=>{ const w=q.closest('.q'), h=w&&w.dataset.hilfe;
      return h?'<li>Frage '+(blocks.indexOf(q)+1)+': '+h+'</li>':''; }).join('');
    box.innerHTML='<span class="lbl">Auswertung</span><p style="margin:.15rem 0"><b>'+r+' von '+n+'</b> beim ersten Versuch richtig.'
      +(r===n?' Stark, alles sitzt.':' Die Auflösungen stehen unter den Fragen.')+'</p>'
      +(hilfen?'<p style="margin:.4rem 0 .1rem">Zum Wiederholen:</p><ul style="margin:.1rem 0">'+hilfen+'</ul>':'')
      +(typeof PAGE!=='undefined'&&PAGE.ziel?'<p style="margin:.5rem 0 0"><b>Ziel der Stunde:</b> '+PAGE.ziel+' Kannst du das jetzt?</p>':''); } }

/* Gemeinsame Optik-Animationen (Lichtteilchen fliegen geradlinig) */

function drawEye(ctx,x,y){ ctx.save(); ctx.fillStyle='#fff'; ctx.strokeStyle='#5a6684'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x-18,y); ctx.quadraticCurveTo(x,y-15,x+18,y); ctx.quadraticCurveTo(x,y+15,x-18,y); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#2f6df6'; ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill(); ctx.fillStyle='#1b2440'; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill(); ctx.restore(); }

// Lichtquelle strahlt geradlinige Strahlen mit fliegenden Lichtteilchen
// Optional: Umschalter Licht an/aus (#modes-ry) und Hindernis an/aus (#modes-wall)
function animRays(root,o){ o=o||{}; const c=root.querySelector('#c-ry'); if(!c) return; let t0=0;
  const angs=o.angs||[-0.55,-0.2,0.15,0.5];
  let lightOn=true, wallOn=!!o.wall;

  bind('#modes-ry',v=>lightOn=v==='on'); bind('#modes-wall',v=>wallOn=v==='on');
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);

    ctx.fillStyle='#f5b301'; ctx.beginPath(); ctx.arc(sx,sy,R,0,7); ctx.fill();

// Kern- und Halbschatten (ausgedehnte Lichtquelle)
// Optional: Regler Lampengroesse (#sl-lamp) und ziehbarer Gegenstand
function drawShadow(root){ const c=root.querySelector('#c-sh'); if(!c) return;
  const sl=root.querySelector('#sl-lamp'), vv=root.querySelector('#val-lamp');
  let obxFrac=0.48, drag=false;
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height}; };
  c.style.touchAction='none';
  c.onpointerdown=e=>{ const p=pos(e); if(Math.abs(p.x-obxFrac)<0.14){ drag=true; try{c.setPointerCapture(e.pointerId);}catch(_){} } };
  c.onpointermove=e=>{ if(!drag) return; const p=pos(e); obxFrac=Math.max(0.24,Math.min(0.72,p.x)); };
  c.onpointerup=c.onpointercancel=()=>{ drag=false; };
  const loop=()=>{ const {ctx,W,H}=fit(c); ctx.clearRect(0,0,W,H);
    let half=0.06; if(sl){ const v=+sl.value; half=0.02+(v/100)*0.13; if(vv) vv.textContent=v+' %'; }
    const sx=W*0.12, sMid=H*0.5, sHalf=H*half, sT=sMid-sHalf, sB=sMid+sHalf;
    const ox=W*obxFrac, oT=H*0.36, oB=H*0.64, wx=W*0.84;
    const rw=(sy,oy)=>{ const tt=(wx-sx)/(ox-sx); return sy+(oy-sy)*tt; };
    const aT=rw(sT,oT), aB=rw(sT,oB), bT=rw(sB,oT), bB=rw(sB,oB);
    const s1=[Math.min(aT,aB),Math.max(aT,aB)], s2=[Math.min(bT,bB),Math.max(bT,bB)];
    const kern=[Math.max(s1[0],s2[0]),Math.min(s1[1],s2[1])], halb=[Math.min(s1[0],s2[0]),Math.max(s1[1],s2[1])];
    ctx.fillStyle='#f7fae8'; ctx.fillRect(wx,0,W-wx,H);
    ctx.fillStyle='#c4cbdb'; ctx.fillRect(wx,halb[0],W-wx,halb[1]-halb[0]);
    if(kern[1]>kern[0]){ ctx.fillStyle='#3a4256'; ctx.fillRect(wx,kern[0],W-wx,kern[1]-kern[0]); }
    ctx.strokeStyle='rgba(245,179,1,.4)'; ctx.lineWidth=1.5;
    [[sT,oT],[sT,oB],[sB,oT],[sB,oB]].forEach(p=>{ ctx.beginPath(); ctx.moveTo(sx,p[0]); ctx.lineTo(wx,rw(p[0],p[1])); ctx.stroke(); });
    ctx.strokeStyle='#f5b301'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(sx,sT); ctx.lineTo(sx,sB); ctx.stroke(); ctx.lineCap='butt';
    lbl(ctx,sx,sT-12,'Lampe',13,'#5a6684');
    ctx.fillStyle=drag?'#6f83ab':'#8b93a7'; rr(ctx,ox-8,oT,16,oB-oT,4); ctx.fill();
    arrow(ctx,ox-18,oB+18,ox-30,oB+18,'#b7c2dc',2); arrow(ctx,ox+18,oB+18,ox+30,oB+18,'#b7c2dc',2);
    lbl(ctx,ox,oB+34,'Gegenstand',13,'#5a6684');
    lbl(ctx,wx-8,(kern[0]+kern[1])/2,'Kernschatten',12,'#fff','right');
    lbl(ctx,wx-8,halb[0]+8,'Halbschatten',11,'#5a6684','right');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Reflexion: oben glatter Spiegel (geordnet), unten raue Fläche (gestreut) – beide gleichzeitig
// Optional: Regler Einfallswinkel (#sl-angle) zeigt oben einen einzelnen Strahl mit Lot
function animReflect(root){ const c=root.querySelector('#c-rf'); if(!c) return; let t0=0;
  const scat=[-1.9,-1.2,-0.6];
  const sl=root.querySelector('#sl-angle'), vv=root.querySelector('#val-angle');
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);
    const my=H*0.42; ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(W*0.18,my); ctx.lineTo(W*0.82,my); ctx.stroke();
    if(sl){ const deg=+sl.value; if(vv) vv.textContent=deg+'°'; const th=deg*Math.PI/180, hx=W*0.5, L=H*0.34;
      lbl(ctx,W/2,H*0.07,'glatte Fläche: Reflexionswinkel = Einfallswinkel',14,'#5a6684');
      ctx.setLineDash([5,5]); ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(hx,my); ctx.lineTo(hx,my-L*1.05); ctx.stroke(); ctx.setLineDash([]);
      lbl(ctx,hx+8,my-L*1.02,'Lot',11,'#5a6684','left');
      const inx=hx-Math.sin(th)*L, iny=my-Math.cos(th)*L, outx=hx+Math.sin(th)*L, outy=my-Math.cos(th)*L;
      ctx.strokeStyle='#f5b301'; arrow(ctx,inx,iny,hx,my,'#f5b301',2.5); arrow(ctx,hx,my,outx,outy,'#f5b301',2.5);
      const ph=(t*0.5)%1; ball(ctx,inx+(hx-inx)*ph,iny+(my-iny)*ph,4,'#f5d000');
      const aIn=Math.atan2(iny-my,inx-hx), aOut=Math.atan2(outy-my,outx-hx), aLot=-Math.PI/2, arR=L*0.34;
      ctx.strokeStyle='#e5533c'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(hx,my,arR,aIn,aLot); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx,my,arR,aLot,aOut); ctx.stroke();
      const mIn=(aIn+aLot)/2, mOut=(aLot+aOut)/2;
      lbl(ctx,hx+Math.cos(mIn)*arR*1.45,my+Math.sin(mIn)*arR*1.45,deg+'°',12,'#b23a26');
      lbl(ctx,hx+Math.cos(mOut)*arR*1.45,my+Math.sin(mOut)*arR*1.45,deg+'°',12,'#b23a26');
      lbl(ctx,(inx+hx)/2-6,(iny+my)/2,'Einfall',11,'#5a6684','right');
      lbl(ctx,(outx+hx)/2+6,(outy+my)/2,'Reflexion',11,'#5a6684','left');
    } else {
      lbl(ctx,W/2,H*0.07,'glatte Fläche (Spiegel): geordnete Reflexion',14,'#5a6684');
      for(let i=0;i<3;i++){ const hx=W*0.36+i*W*0.12, L=H*0.28; ctx.strokeStyle='#f5b301'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(hx-L,my-L); ctx.lineTo(hx,my); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx,my); ctx.lineTo(hx+L,my-L); ctx.stroke();
        const ph=(t*0.5+i*0.2)%1; ball(ctx,hx-L+L*ph,my-L+L*ph,4,'#f5d000'); } }
    const ry=H*0.84; ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(W*0.18,ry); let up=1;
    for(let x=W*0.18;x<=W*0.82;x+=14){ ctx.lineTo(x,ry+(up>0?-5:5)); up=-up; } ctx.stroke();
    lbl(ctx,W/2,H*0.6,'raue Fläche: Streuung in alle Richtungen',14,'#5a6684');
    for(let i=0;i<3;i++){ const hx=W*0.36+i*W*0.12, L=H*0.22; ctx.strokeStyle='#f5b301'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(hx-L,ry-L); ctx.lineTo(hx,ry); ctx.stroke();
      const phi=(t*0.5+i*0.2)%1; ball(ctx,hx-L+L*phi,ry-L+L*phi,4,'#f5d000');
      const a=scat[i]; ctx.beginPath(); ctx.moveTo(hx,ry); ctx.lineTo(hx+Math.cos(a)*L,ry+Math.sin(a)*L); ctx.stroke(); }
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Transmission / Absorption / Reflexion an drei Materialien

function animMaterial(root){ const c=root.querySelector('#c-ma'); if(!c) return; let t0=0;
  let mode=null, warm=0;
  const mm=root.querySelector('#modes-ma');
  if(mm){ mode='glas'; mm.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    mm.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); mode=b.dataset.mode; if(mode!=='schwarz') warm=0; })); }
  const single=(ctx,W,H,t)=>{ const x0=W*0.08, mx=W*0.5, x1=W*0.9, y=H*0.5;
    const col = mode==='glas'?'rgba(120,180,255,.35)': mode==='schwarz'?'#20242e': mode==='toenung'?'rgba(80,100,130,.55)':'#eef2fb';
    ctx.strokeStyle='#f5b301'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(mx-14,y); ctx.stroke();
    ctx.fillStyle=col; ctx.strokeStyle='#6f83ab'; ctx.lineWidth=2; rr(ctx,mx-14,y-70,28,140,6); ctx.fill(); ctx.stroke();
    const ph=(t*0.5)%1; let lab;
    if(mode==='glas'){ ctx.strokeStyle='rgba(245,179,1,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mx+14,y); ctx.lineTo(x1,y); ctx.stroke();
      ball(ctx,x0+(x1-x0)*ph,y,4,'#f5d000'); lab='Transmission: Licht geht hindurch'; }
    else if(mode==='schwarz'){ ball(ctx,x0+(mx-14-x0)*Math.min(1,ph*2),y,4,'#f5d000');
      warm=Math.min(1,warm+0.004);
      const tx=W*0.8, tT=y-64, tB=y+44, br=12;
      ctx.strokeStyle='#6f83ab'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(tx,tT); ctx.lineTo(tx,tB); ctx.stroke();
      ctx.fillStyle='#e5533c'; ctx.beginPath(); ctx.arc(tx,tB+br,br,0,7); ctx.fill();
      ctx.strokeStyle='#e5533c'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(tx,tB); ctx.lineTo(tx,tB-(tB-tT)*warm); ctx.stroke(); ctx.lineCap='butt';
      lbl(ctx,tx,tT-14,'wird warm',11,'#5a6684'); lab='Absorption: Licht wird geschluckt'; }
    else if(mode==='toenung'){ ctx.strokeStyle='rgba(245,179,1,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(mx-14,y); ctx.stroke();
      ctx.strokeStyle='rgba(245,179,1,.3)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mx+14,y); ctx.lineTo(x1,y); ctx.stroke();
      if(ph<0.5){ ball(ctx,x0+(mx-14-x0)*(ph/0.5),y,4,'#f5d000'); }
      else { ball(ctx,(mx+14)+(x1-(mx+14))*((ph-0.5)/0.5),y,3,'rgba(245,208,0,.55)'); }
      lab='Teildurchlässig: nur ein Teil geht hindurch'; }
    else { ctx.strokeStyle='#f5b301'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mx-14,y); ctx.lineTo(x0+W*0.2,y-H*0.28); ctx.stroke();
      let p=ph*2; if(p<1){ ball(ctx,x0+(mx-14-x0)*p,y,4,'#f5d000'); } else { p-=1; ball(ctx,(mx-14)+((x0+W*0.2)-(mx-14))*p,y+((y-H*0.28)-y)*p,4,'#f5d000'); }
      lab='Reflexion: Licht wird zurückgeworfen'; }
    lbl(ctx,W/2,H*0.92,lab,14,'#5a6684'); };
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);
    if(mode){ single(ctx,W,H,t); RAF=requestAnimationFrame(loop); return; }
    const x0=W*0.08, mx=W*0.5, x1=W*0.9;
    const lanes=[{y:H*0.22,t:'glas'},{y:H*0.5,t:'schwarz'},{y:H*0.78,t:'weiss'}];
    lanes.forEach(ln=>{ const y=ln.y, col=ln.t==='glas'?'rgba(120,180,255,.35)':ln.t==='schwarz'?'#20242e':'#eef2fb';
      ctx.fillStyle='#f5b301'; ctx.strokeStyle='#f5b301'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(mx-12,y); ctx.stroke();
      ctx.fillStyle=col; ctx.strokeStyle='#6f83ab'; ctx.lineWidth=2; rr(ctx,mx-12,y-38,24,76,4); ctx.fill(); ctx.stroke();
      const ph=(t*0.5)%1;
      if(ln.t==='glas'){ ctx.strokeStyle='rgba(245,179,1,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mx+12,y); ctx.lineTo(x1,y); ctx.stroke();
        const x=x0+(x1-x0)*ph; ball(ctx,x,y,4,'#f5d000'); }
      else if(ln.t==='schwarz'){ const x=x0+(mx-12-x0)*Math.min(1,ph*2); ball(ctx,x,y,4,'#f5d000'); }
      else { ctx.strokeStyle='#f5b301'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mx-12,y); ctx.lineTo(x0+W*0.16,y-H*0.12); ctx.stroke();
        let p=ph*2; if(p<1){ ball(ctx,x0+(mx-12-x0)*p,y,4,'#f5d000'); } else { p-=1; ball(ctx,(mx-12)+((x0+W*0.16)-(mx-12))*p, y+((y-H*0.12)-y)*p,4,'#f5d000'); } }
      const lab=ln.t==='glas'?'Glas: Licht geht hindurch':ln.t==='schwarz'?'schwarz: Licht wird geschluckt':'hell/glänzend: Licht wird zurückgeworfen';
      lbl(ctx,x1,y-44,lab,12,'#5a6684','right'); });
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Lochkamera: Gegenstand -> kleines Loch -> umgedrehtes Bild auf dem Schirm
function drawPinhole(root){ const c=root.querySelector('#c-pinhole'); if(!c) return; let t0=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);
    const ox=W*0.12, mid=H*0.5, oh=H*0.28, oT=mid-oh, oB=mid+oh;
    const hx=W*0.52, hy=mid, sx=W*0.88, ww=W*0.02;
    const yImg=(y0)=> y0+(hy-y0)*((sx-ox)/(hx-ox));
    const iT=yImg(oT), iB=yImg(oB);
    ctx.fillStyle='#6b7590'; ctx.fillRect(hx-ww/2,0,ww,hy-8); ctx.fillRect(hx-ww/2,hy+8,ww,H-(hy+8));
    lbl(ctx,hx+14,hy,'Loch',11,'#5a6684','left');
    [[oT,iT],[oB,iB]].forEach((rr2,ri)=>{ ctx.strokeStyle='rgba(245,179,1,.4)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(ox,rr2[0]); ctx.lineTo(sx,rr2[1]); ctx.stroke();
      for(let k=0;k<4;k++){ const ph=((t*0.4)+ri*0.12+k*0.25)%1; ball(ctx,ox+(sx-ox)*ph,rr2[0]+(rr2[1]-rr2[0])*ph,4,'#f5d000'); } });
    arrow(ctx,ox,oB,ox,oT,'#f5b301',4); lbl(ctx,ox,oB+16,'Gegenstand',13,'#5a6684');
    ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(sx,Math.min(iT,iB)-10); ctx.lineTo(sx,Math.max(iT,iB)+10); ctx.stroke();
    arrow(ctx,sx,iB,sx,iT,'#e5533c',4); lbl(ctx,sx,Math.max(iT,iB)+16,'Bild',12,'#5a6684');
    lbl(ctx,W/2,H*0.94,'Kleines Loch: das Bild steht auf dem Kopf',13,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Matter Gegenstand streut Licht in alle Richtungen; ein Strahl faellt durch die Pupille ins Auge
function drawScatter(root){ const c=root.querySelector('#c-streu'); if(!c) return; let t0=0;
  const dirs=[-2.6,-2.1,-1.6,-1.1,-0.6,-0.1,0.4,0.9,1.4];
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);
    const lx=W*0.14, ly=H*0.2, ox=W*0.44, oy=H*0.56, ex=W*0.86, ey=H*0.4, R=Math.min(W,H);
    arrow(ctx,lx,ly,ox,oy,'rgba(245,179,1,.5)',2);
    for(let k=0;k<4;k++){ const ph=((t*0.5)+k*0.25)%1; ball(ctx,lx+(ox-lx)*ph,ly+(oy-ly)*ph,4,'#f5d000'); }
    ctx.fillStyle='#f5b301'; ctx.beginPath(); ctx.arc(lx,ly,R*0.035,0,7); ctx.fill(); lbl(ctx,lx,ly-R*0.06,'Lampe',13,'#5a6684');
    const sl2=R*0.16; dirs.forEach(a=>{ ctx.strokeStyle='rgba(229,83,60,.35)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+Math.cos(a)*sl2,oy+Math.sin(a)*sl2); ctx.stroke(); });
    ctx.fillStyle='#e5533c'; ctx.beginPath(); ctx.arc(ox,oy,R*0.05,0,7); ctx.fill(); lbl(ctx,ox,oy+R*0.09,'matter Gegenstand',13,'#5a6684');
    arrow(ctx,ox,oy,ex,ey,'rgba(229,83,60,.7)',2.5);
    for(let k=0;k<3;k++){ const ph=((t*0.5)+k*0.33)%1; ball(ctx,ox+(ex-ox)*ph,oy+(ey-oy)*ph,4,'#e5533c'); }
    drawEye(ctx,ex,ey); lbl(ctx,ex,ey-24,'Auge',13,'#5a6684');
    ctx.strokeStyle='#5a6684'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ex,ey+7); ctx.lineTo(ex+18,ey+20); ctx.stroke();
    lbl(ctx,ex+22,ey+22,'Pupille lässt Licht ein',11,'#5a6684','left');
    lbl(ctx,W/2,H*0.95,'Der matte Gegenstand streut das Licht in alle Richtungen',13,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Mondphase als Scheibe: f=0 Neumond ... f=1 Vollmond, beleuchtet von links
function moonPhase(ctx,cx,cy,r,f){
  ctx.fillStyle='#2a3042'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e9edf6'; ctx.beginPath();
  ctx.ellipse(cx,cy,r,r,0,Math.PI/2,-Math.PI/2,false);
  const rx=r*(2*f-1);
  ctx.ellipse(cx,cy,Math.abs(rx),r,0,-Math.PI/2,Math.PI/2, rx<=0);
  ctx.fill();
  ctx.strokeStyle='#8b93a7'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
}

// Zusatzbilder Schatten: zwei Lampen (ziehbar), Sonnenstand (Regler), Mondphasen
function animShadowExtras(root){
  const c2=root.querySelector('#c-2lamp'), cs=root.querySelector('#c-sunshadow'), cm=root.querySelector('#c-moonphase');
  const slSun=root.querySelector('#sl-sun'), svSun=root.querySelector('#val-sun');
  let obx=0.5, drag=false;
  if(c2){ const px=e=>{ const r=c2.getBoundingClientRect(); return (e.clientX-r.left)/r.width; };
    c2.style.touchAction='none';
    c2.onpointerdown=e=>{ if(Math.abs(px(e)-obx)<0.16){ drag=true; try{c2.setPointerCapture(e.pointerId);}catch(_){}} };
    c2.onpointermove=e=>{ if(drag) obx=Math.max(0.32,Math.min(0.6,px(e))); };
    c2.onpointerup=c2.onpointercancel=()=>{ drag=false; }; }
  const drawTwoLamps=()=>{ const {ctx,W,H}=fit(c2); ctx.clearRect(0,0,W,H);
    const lx=W*0.12, l1=H*0.3, l2=H*0.7, ox=W*obx, oT=H*0.4, oB=H*0.6, wx=W*0.9;
    const proj=(ly,oy)=> ly+(oy-ly)*((wx-lx)/(ox-lx));
    ctx.fillStyle='#f7fae8'; ctx.fillRect(wx,0,W-wx,H);
    [l1,l2].forEach(ly=>{ const a=proj(ly,oT), b=proj(ly,oB); ctx.fillStyle='rgba(58,66,86,.5)'; ctx.fillRect(wx,Math.min(a,b),W-wx,Math.abs(b-a)); });
    [l1,l2].forEach(ly=>{ ctx.strokeStyle='rgba(245,179,1,.3)'; ctx.lineWidth=1.5; [oT,oB].forEach(oy=>{ ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(wx,proj(ly,oy)); ctx.stroke(); }); });
    [[l1,'Lampe 1'],[l2,'Lampe 2']].forEach(p=>{ ctx.fillStyle='#f5b301'; ctx.beginPath(); ctx.arc(lx,p[0],W*0.02,0,7); ctx.fill(); lbl(ctx,lx,p[0]-W*0.035,p[1],11,'#5a6684'); });
    ctx.fillStyle=drag?'#6f83ab':'#8b93a7'; rr(ctx,ox-7,oT,14,oB-oT,4); ctx.fill();
    arrow(ctx,ox-16,oB+16,ox-28,oB+16,'#b7c2dc',2); arrow(ctx,ox+16,oB+16,ox+28,oB+16,'#b7c2dc',2);
    lbl(ctx,ox,oB+30,'ziehen',11,'#5a6684');
    lbl(ctx,W/2,H*0.08,'Zwei Lampen → zwei Schatten, in der Mitte überlappen sie',13,'#5a6684'); };
  const drawSun=()=>{ const {ctx,W,H}=fit(cs); ctx.clearRect(0,0,W,H);
    let el=50; if(slSun){ el=+slSun.value; if(svSun) svSun.textContent=el+'°'; }
    const gy=H*0.8, mastx=W*0.4, masth=H*0.5, th=el*Math.PI/180;
    ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(W*0.06,gy); ctx.lineTo(W*0.94,gy); ctx.stroke();
    const sunx=mastx-Math.cos(th)*W*0.3, suny=gy-Math.sin(th)*W*0.3;
    ctx.strokeStyle='rgba(245,179,1,.6)'; ctx.lineWidth=2; for(let k=0;k<10;k++){ const a=k/10*6.283; ctx.beginPath(); ctx.moveTo(sunx+Math.cos(a)*W*0.028,suny+Math.sin(a)*W*0.028); ctx.lineTo(sunx+Math.cos(a)*W*0.045,suny+Math.sin(a)*W*0.045); ctx.stroke(); }
    ctx.fillStyle='#f5b301'; ctx.beginPath(); ctx.arc(sunx,suny,W*0.025,0,7); ctx.fill();
    const shadow=masth/Math.tan(Math.max(0.2,th)), shEnd=Math.min(W*0.92,mastx+shadow);
    ctx.strokeStyle='rgba(245,179,1,.45)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(sunx,suny); ctx.lineTo(mastx,gy-masth); ctx.stroke();
    ctx.strokeStyle='#3a4256'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(mastx,gy); ctx.lineTo(shEnd,gy); ctx.stroke(); ctx.lineCap='butt';
    ctx.strokeStyle='#6b7590'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(mastx,gy); ctx.lineTo(mastx,gy-masth); ctx.stroke();
    const tag=el<30?'tief (morgens/abends): langer Schatten': el>65?'hoch (mittags): kurzer Schatten':'mittlerer Sonnenstand';
    lbl(ctx,W/2,H*0.12,'Sonnenstand '+tag,13,'#5a6684'); };
  const drawMoon=()=>{ const {ctx,W,H}=fit(cm); ctx.clearRect(0,0,W,H);
    const n=5, r=Math.min(H*0.24,W*0.075), cy=H*0.46, names=['Neumond','Sichel','Halbmond','fast voll','Vollmond'];
    lbl(ctx,W*0.04,cy,'Sonne →',10,'#5a6684','left');
    for(let i=0;i<n;i++){ const cx=W*(0.2+0.16*i); moonPhase(ctx,cx,cy,r,i/(n-1)); lbl(ctx,cx,cy+r+15,names[i],11,'#5a6684'); }
    lbl(ctx,W/2,H*0.12,'Mondphasen: sichtbar ist die beleuchtete Seite, der Rest liegt im Eigenschatten',12,'#5a6684'); };
  const loop=()=>{ if(c2) drawTwoLamps(); if(cs) drawSun(); if(cm) drawMoon(); RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Spiegelbild-Konstruktion (scheinbarer Punkt hinter dem Spiegel) + zwei Spiegel im rechten Winkel
function animMirrorExtras(root){ const cm=root.querySelector('#c-mirrorimg'), ct=root.querySelector('#c-2mirror');
  const drawMirrorImg=()=>{ const {ctx,W,H}=fit(cm); ctx.clearRect(0,0,W,H);

    ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(mx,H*0.14); ctx.lineTo(mx,H*0.86); ctx.stroke();
    ctx.strokeStyle='rgba(154,168,198,.5)'; ctx.lineWidth=1.5; for(let y=H*0.16;y<H*0.86;y+=12){ ctx.beginPath(); ctx.moveTo(mx,y); ctx.lineTo(mx+10,y+10); ctx.stroke(); }
    ctx.setLineDash([4,4]); ctx.strokeStyle='#b7c2dc'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ix,oy); ctx.stroke(); ctx.setLineDash([]);
    lbl(ctx,(ox+mx)/2,oy-16,'d',13,'#5a6684'); lbl(ctx,(ix+mx)/2,oy-16,'d',13,'#5a6684');
    const hy=ey+(oy-ey)*((mx-ex)/(ix-ex));
    ctx.strokeStyle='#f5b301'; arrow(ctx,ox,oy,mx,hy,'#f5b301',2); arrow(ctx,mx,hy,ex,ey,'#f5b301',2);
    ctx.setLineDash([5,5]); ctx.strokeStyle='rgba(245,179,1,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(mx,hy); ctx.lineTo(ix,oy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#e5533c'; ctx.beginPath(); ctx.arc(ox,oy,6,0,7); ctx.fill(); lbl(ctx,ox,oy+18,'Gegenstand',11,'#5a6684');
    ctx.globalAlpha=.45; ctx.fillStyle='#e5533c'; ctx.beginPath(); ctx.arc(ix,oy,6,0,7); ctx.fill(); ctx.globalAlpha=1; lbl(ctx,ix,oy+18,'scheinbares Bild',11,'#5a6684');

    imgs.forEach(p=>{ ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(229,83,60,.3)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(p[0],p[1]); ctx.stroke(); ctx.setLineDash([]);
      ctx.globalAlpha=.4; ctx.fillStyle='#e5533c'; ctx.beginPath(); ctx.arc(p[0],p[1],7,0,7); ctx.fill(); ctx.globalAlpha=1; });
    ctx.fillStyle='#e5533c'; ctx.beginPath(); ctx.arc(ox,oy,8,0,7); ctx.fill(); lbl(ctx,ox,oy-16,'Gegenstand',11,'#5a6684');
    lbl(ctx,W/2,H*0.05,'Zwei Spiegel im rechten Winkel → drei Bilder',13,'#5a6684'); };
  const loop=()=>{ if(cm) drawMirrorImg(); if(ct) drawTwo(); RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Farbfilter (rotes Glas lässt nur Rot durch) + Prisma (weißes Licht -> Farben)
function animColorExtras(root){ const cf=root.querySelector('#c-filter'), cp=root.querySelector('#c-prism'); let t0=0;
  const drawFilter=(t)=>{ const {ctx,W,H}=fit(cf); ctx.clearRect(0,0,W,H);
    const x0=W*0.08, gx=W*0.52, x1=W*0.94, y=H*0.5, cols=['#e5533c','#37b24d','#2f6df6'], off=[-H*0.16,0,H*0.16];
    ctx.fillStyle='rgba(229,83,60,.3)'; ctx.strokeStyle='#b23a26'; ctx.lineWidth=2; rr(ctx,gx-12,y-H*0.28,24,H*0.56,6); ctx.fill(); ctx.stroke();
    lbl(ctx,gx,y-H*0.33,'Rotfilter',13,'#b23a26');
    cols.forEach((col,ci)=>{ const yy=y+off[ci], stop=ci===0?x1:gx-12;
      ctx.strokeStyle=col; ctx.globalAlpha=.4; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(stop,yy); ctx.stroke(); ctx.globalAlpha=1;
      const ph=((t*0.4)+ci*0.13)%1; ball(ctx,x0+(stop-x0)*ph,yy,4,col); });
    lbl(ctx,x0,y-H*0.36,'weißes Licht',11,'#5a6684','left');
    lbl(ctx,W/2,H*0.93,'Rotes Glas lässt nur Rot durch – Grün und Blau werden geschluckt',13,'#5a6684'); };
  const drawPrism=()=>{ const {ctx,W,H}=fit(cp); ctx.clearRect(0,0,W,H);
    const px=W*0.46, py=H*0.5, s=Math.min(W,H)*0.3;
    ctx.fillStyle='rgba(150,180,220,.25)'; ctx.strokeStyle='#8b93a7'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px,py-s); ctx.lineTo(px-s*0.7,py+s*0.6); ctx.lineTo(px+s*0.7,py+s*0.6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#c4cbdb'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(W*0.06,py); ctx.lineTo(px-s*0.12,py); ctx.stroke();
    lbl(ctx,W*0.06,py-14,'weißes Licht',11,'#5a6684','left');
    const spec=['#e5533c','#f2a521','#f5d000','#37b24d','#2f6df6','#7048e8'], bx=px+s*0.1, by=py+s*0.12;
    spec.forEach((col,i)=>{ const a=-0.3+i*0.11; ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(W*0.94, by+Math.tan(a)*(W*0.94-bx)); ctx.stroke(); });
    lbl(ctx,W/2,H*0.92,'Weißes Licht besteht aus vielen Farben (mehr in Klasse 8)',13,'#5a6684'); };
  const loop=ts=>{ if(!t0)t0=ts; const t=(ts-t0)/1000; if(cf) drawFilter(t); if(cp) drawPrism(); RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

/* ---------- Layout: Simulation und Text nebeneinander ---------- */
// Hat ein Schritt eine Simulation, kommen Canvas + Regler nach links, der Text nach rechts.
// Schritte ohne Canvas bleiben einspaltig mit begrenzter Lesebreite.
function layoutStage(stage){
  const h2=stage.querySelector(':scope > h2');
  const kids=[...stage.children].filter(el=>el!==h2);
  if(!kids.length) return;
  const isViz=el=>el.tagName==='CANVAS'||['ctrl','ctrls','vswitch','modes','btnrow','nav','dots'].some(c=>el.classList.contains(c));
  if(kids.some(el=>el.tagName==='CANVAS')){
    const row=document.createElement('div'); row.className='split';
    const L=document.createElement('div'); L.className='col-viz';
    const R=document.createElement('div'); R.className='col-text';
    kids.forEach(el=>(isViz(el)?L:R).appendChild(el));
    row.appendChild(L);
    if(R.children.length) row.appendChild(R); else L.classList.add('solo');
    stage.appendChild(row);
  } else {
    const one=document.createElement('div'); one.className='col-single';
    kids.forEach(el=>one.appendChild(el));
    stage.appendChild(one);
  }
}

/* ---------- Navigation ---------- */
let i=0;
function buildSteps(){ const box=$('#steps'); box.innerHTML='';
  SECTIONS.forEach((s,k)=>{ const b=document.createElement('button'); b.className='step'+(k===i?' on':'');
    b.innerHTML='<span class="n">'+(k+1)+'</span>'+s.step; b.addEventListener('click',()=>go(k)); box.appendChild(b); });
  // aktiven Abschnitt in die Mitte der Leiste holen
  const on=box.querySelector('.step.on');
  if(on && box.scrollWidth>box.clientWidth){ const r=on.getBoundingClientRect(), rb=box.getBoundingClientRect();
    box.scrollLeft += (r.left+r.width/2)-(rb.left+rb.width/2); }
  stepsRand(); }
// Ausblendung an den Rändern nur dort, wo noch Abschnitte versteckt sind
function stepsRand(){ const box=$('#steps'); if(!box) return; const max=box.scrollWidth-box.clientWidth;
  box.classList.toggle('mehr-l', max>1 && box.scrollLeft>2); box.classList.toggle('mehr-r', max>1 && box.scrollLeft<max-2); }
(function(){ const box=$('#steps'); if(!box) return;
  box.addEventListener('scroll', stepsRand, {passive:true});
  // Mausrad nach unten scrollt die Leiste nach rechts
  box.addEventListener('wheel', e=>{ if(box.scrollWidth<=box.clientWidth || Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
    box.scrollLeft+=e.deltaY; e.preventDefault(); }, {passive:false});
  window.addEventListener('resize', stepsRand); })();
function render(){ stopRAF(); if(window.__stopSound) try{ window.__stopSound(); }catch(_){} const s=SECTIONS[i];
  // Lernziel der Stunde (PAGE.ziel, optional) steht im ersten Schritt ganz oben
  const ziel=(i===0&&PAGE.ziel)?'<div class="box ziel"><span class="lbl">Ziel dieser Stunde</span>'+PAGE.ziel+'</div>':'';
  $('#stage').innerHTML='<h2>'+s.title+'</h2>'+ziel+s.html;
  layoutStage($('#stage'));
  $('#prev').disabled=i===0; $('#next').disabled=i===SECTIONS.length-1;
  buildSteps(); if(s.init) s.init($('#stage')); }
function go(k){ i=Math.max(0,Math.min(SECTIONS.length-1,k)); render(); }
$('#prev').onclick=()=>go(i-1);
$('#next').onclick=()=>go(i+1);
document.title=PAGE.title; $('#h1').textContent=PAGE.h1; render();
</script>
