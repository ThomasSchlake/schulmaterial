<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){function v(){document.documentElement.style.setProperty('--vh',(window.innerHeight*0.01)+'px');}v();window.addEventListener('resize',v);window.addEventListener('orientationchange',v);})();</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6df6'/><circle cx='16' cy='16' r='2.6' fill='%23fff'/><g fill='none' stroke='%23fff' stroke-width='2'><ellipse cx='16' cy='16' rx='10.5' ry='4.6'/><ellipse cx='16' cy='16' rx='10.5' ry='4.6' transform='rotate(60 16 16)'/><ellipse cx='16' cy='16' rx='10.5' ry='4.6' transform='rotate(120 16 16)'/></g></svg>">
<title>Wärmelehre</title>
<style>
  :root{
    --bg:#eef2fa; --panel:#fff; --ink:#1b2440; --muted:#5a6684; --line:#d8def0;
    --blue:#2f6df6; --blue-d:#1f4fc4; --amber:#f2a521; --green:#25b071; --red:#e5533c;
    --sky1:#eaf1ff; --sky2:#f7faff; --shadow:0 6px 24px rgba(27,36,64,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    font-size:clamp(16px,1.25vw,20px); line-height:1.5}
  .app{height:calc(var(--vh,1vh)*100); display:flex; flex-direction:column; max-width:1080px; margin:0 auto;
    padding:clamp(.6rem,1.6vw,1.1rem); overflow:hidden}

  .top{background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow);
    padding:clamp(.55rem,1.3vw,.9rem) clamp(.8rem,1.8vw,1.2rem); margin-bottom:.6rem}
  .tag{font-weight:800; color:var(--blue-d); font-size:.82em; letter-spacing:.3px}
  .top h1{margin:.1rem 0 .5rem; font-size:clamp(1.2rem,2.5vw,1.75rem)}
  .steps{display:flex; flex-wrap:wrap; gap:.35rem}
  .step{border:1px solid var(--line); background:#f4f7ff; color:var(--muted); border-radius:999px;
    padding:.26rem .7rem; font-size:.8rem; font-weight:700; cursor:pointer}
  .step.on{background:var(--blue); color:#fff; border-color:var(--blue)}
  .step .n{opacity:.7; margin-right:.35rem}

  .stage{flex:1 1 auto; background:var(--panel); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:clamp(.9rem,2vw,1.4rem); min-height:0; overflow:hidden;
    display:flex; flex-direction:column}
  .stage > h2{flex:0 0 auto}
  .stage h2{margin:.1rem 0 .8rem; font-size:clamp(1.2rem,2.4vw,1.6rem)}
  /* Zweispaltig: Simulation links, Text rechts. Fällt bei schmal/hochkant auf Stapel zurück. */
  .split{flex:1 1 auto; min-height:0; display:flex; gap:.85rem; align-items:stretch}
  .col-viz{flex:0 0 57%; min-width:0; overflow-y:auto; display:flex; flex-direction:column; gap:.5rem}
  .col-viz.solo{flex:1 1 auto}
  .col-text{flex:1 1 43%; min-width:0; overflow-y:auto; padding-left:.55rem}
  .col-single{flex:1 1 auto; min-height:0; overflow-y:auto; max-width:72ch; margin:0 auto; width:100%; padding-inline:.55rem}
  .col-text > :first-child, .col-single > :first-child{margin-top:0}
  .split .col-viz > canvas{flex:1 1 auto; height:auto; max-height:none; min-height:170px}
  @media (max-width:820px), (orientation:portrait){
    .split{flex-direction:column; overflow-y:auto; gap:.4rem}
    .col-viz,.col-text{flex:0 0 auto; overflow:visible}
    .split .col-viz > canvas{flex:0 0 auto; height:calc(var(--vh,1vh)*34); max-height:320px; min-height:150px}
  }
  .stage p{margin:.55rem 0}
  .stage b{color:var(--ink)}
  .lead{color:var(--muted)}

  .box{background:var(--sky2); border:1px solid var(--line); border-radius:14px; padding:.9rem 1.1rem; margin:.9rem 0}
  .box.merke{background:#eef4ff; border-color:#cfe0ff}
  .box.merke .lbl{color:var(--blue-d)}
  .box.frage{background:#fff7e9; border-color:#f2d9a6}
  .box.frage .lbl{color:#b06f00}
  .box.warn{background:#fdecea; border-color:#f3b4ab}
  .box.warn .lbl{color:#b23a26}
  .box .lbl{font-weight:800; font-size:.8em; letter-spacing:.3px; text-transform:uppercase; display:block; margin-bottom:.2rem}

  canvas.viz{width:100%; height:calc(var(--vh,1vh)*30); max-height:300px; min-height:150px; display:block; border-radius:12px;
    background:linear-gradient(var(--sky2),var(--sky1)); border:1px solid var(--line); touch-action:none}
  canvas.mini{width:100%; height:calc(var(--vh,1vh)*20); max-height:160px; min-height:110px; display:block; border-radius:12px;
    background:linear-gradient(var(--sky2),var(--sky1)); border:1px solid var(--line)}

  .cases{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:.6rem; margin:.7rem 0}
  .case{background:var(--sky2); border:1px solid var(--line); border-radius:14px; padding:.65rem .8rem; font-size:.92em}
  .case h3{margin:.1rem 0 .25rem; font-size:1rem}
  .case .res{margin-top:.5rem; padding-top:.45rem; border-top:1px dashed var(--line); color:var(--ink)}
  .reveal{border:1px solid var(--line); background:#eef2fb; color:var(--ink); border-radius:10px;
    padding:.5rem .9rem; font:inherit; font-weight:700; cursor:pointer; margin-top:.6rem}
  .reveal:active{transform:translateY(1px)}

  .cmp{width:100%; border-collapse:collapse; margin:.7rem 0}
  .cmp th,.cmp td{border:1px solid var(--line); padding:.6rem .85rem; text-align:left; vertical-align:top}
  .cmp thead th{font-size:1.1rem}
  .cmp thead th:nth-child(2){background:#fdeeeb; color:#b23a26}
  .cmp thead th:nth-child(3){background:#fff4e2; color:#9a6300}
  .cmp tbody th{background:var(--sky2); color:var(--muted); font-weight:700; width:26%; font-size:.9em}

  .choices{display:flex; flex-direction:column; gap:.55rem; margin:.8rem 0}
  .choice{text-align:left; border:2px solid var(--line); background:#fff; border-radius:12px;
    padding:.75rem 1rem; font:inherit; color:inherit; cursor:pointer}
  .choice:active{transform:translateY(1px)}
  .choice.right{border-color:var(--green); background:#eafaf1}
  .choice.wrong{border-color:var(--red); background:#fdeeeb}
  .solution{margin-top:.6rem}
  .modes{display:flex; flex-wrap:wrap; gap:.5rem; margin:.8rem 0}
  .modes button{border:1px solid var(--line); background:#f4f7ff; color:var(--ink); border-radius:999px;
    padding:.55rem 1.1rem; font:inherit; font-weight:700; cursor:pointer}
  .modes button.on{background:var(--blue); color:#fff; border-color:var(--blue)}
  .modes button:active{transform:translateY(1px)}
  .ctrl{display:flex; align-items:center; gap:.9rem; margin:.9rem 0 .2rem; background:var(--sky2);
    border:1px solid var(--line); border-radius:12px; padding:.7rem 1rem}
  .ctrl label{font-weight:800; color:var(--blue-d); white-space:nowrap}
  .ctrl input[type=range]{flex:1 1 auto; -webkit-appearance:none; appearance:none; height:10px;
    background:linear-gradient(90deg,#7fb0ff,#e5533c); border-radius:6px; outline:none}
  .ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:30px; height:30px; border-radius:50%;
    background:#fff; border:3px solid var(--blue); box-shadow:var(--shadow); cursor:pointer}
  .ctrl input[type=range]::-moz-range-thumb{width:28px; height:28px; border-radius:50%; background:#fff; border:3px solid var(--blue); cursor:pointer}
  .ctrl .val{font-weight:800; color:var(--ink); min-width:5ch; text-align:right}
  .btnrow{display:flex; flex-wrap:wrap; gap:.6rem; margin:.8rem 0}
  .q{margin:.2rem 0 1rem}
  .q + .q{border-top:1px solid var(--line); padding-top:.9rem; margin-top:1rem}

  .nav{display:flex; gap:.7rem; align-items:center; margin-top:.8rem}
  .btn{border:none; border-radius:12px; padding:.7rem 1.25rem; font-size:1.05rem; font-weight:700;
    cursor:pointer; background:var(--blue); color:#fff; box-shadow:var(--shadow)}
  .btn.ghost{background:#eef2fb; color:var(--ink)}
  .btn:disabled{opacity:.45; cursor:default}
  .spacer{flex:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="../index.html" style="display:inline-block;color:var(--blue-d);text-decoration:none;font-weight:700;font-size:.9rem;margin-bottom:.35rem">‹ Übersicht</a>
    <span class="tag" id="tag"></span>
    <h1 id="h1"></h1>
    <div class="steps" id="steps"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="nav">
    <button class="btn ghost" id="prev">‹ Zurück</button>
    <div class="spacer"></div>
    <button class="btn" id="next">Weiter ›</button>
  </div>
</div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);

/* ---------- gemeinsame Bausteine ---------- */
let RAF=0;
function stopRAF(){ if(RAF) cancelAnimationFrame(RAF); RAF=0; }
function fit(c){ const dpr=window.devicePixelRatio||1, W=c.clientWidth||600, H=c.clientHeight||300;
  if(c.width!==Math.round(W*dpr)||c.height!==Math.round(H*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return {ctx,W,H}; }
function parts(n,seed,speed){ let r=seed; const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  const a=[]; for(let i=0;i<n;i++){ const ang=rnd()*6.283; a.push({x:0.08+rnd()*0.84,y:0.08+rnd()*0.84,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed}); } return a; }
function move(ps,dt,mx,my){ mx=mx||0.04; my=my||mx; ps.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt;
  if(p.x<mx){p.x=mx;p.vx=Math.abs(p.vx);} if(p.x>1-mx){p.x=1-mx;p.vx=-Math.abs(p.vx);}
  if(p.y<my){p.y=my;p.vy=Math.abs(p.vy);} if(p.y>1-my){p.y=1-my;p.vy=-Math.abs(p.vy);} }); }
function ball(ctx,x,y,r,col){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle=col; ctx.fill();
  ctx.beginPath(); ctx.arc(x-r*0.3,y-r*0.3,r*0.34,0,7); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fill(); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function lbl(ctx,x,y,t,size,col,align){ ctx.fillStyle=col||'#3a4256'; ctx.font='700 '+Math.round(size)+'px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y); }
function drawVessel(ctx,box,ps,r,col,title,sub){
  ctx.strokeStyle='#b7c2dc'; ctx.lineWidth=2.5; rr(ctx,box.x,box.y,box.w,box.h,12); ctx.stroke();
  ps.forEach(p=> ball(ctx, box.x+p.x*box.w, box.y+p.y*box.h, r, col));
  lbl(ctx, box.x+box.w/2, box.y-24, title, 18, '#1b2440');
  if(sub) lbl(ctx, box.x+box.w/2, box.y-6, sub, 14, '#5a6684');
}
function energyBar(ctx,x,y,w,frac,col,cap){ ctx.fillStyle='#e7ecf6'; rr(ctx,x,y,w,16,8); ctx.fill();
  ctx.fillStyle=col; rr(ctx,x,y,Math.max(8,w*frac),16,8); ctx.fill();
  lbl(ctx,x,y-14,cap,13,'#5a6684','left'); }
function arrow(ctx,x1,y1,x2,y2,col,wd){ const a=Math.atan2(y2-y1,x2-x1), h=(wd||2)*3.2;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=wd||2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  ctx.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4)); ctx.closePath(); ctx.fill(); }
// Antworten in den Beispielen erst auf Klick zeigen
function revealCases(root){ root.querySelectorAll('.reveal').forEach(b=>b.addEventListener('click',()=>{
  const res=b.nextElementSibling; if(res) res.hidden=false; b.hidden=true; })); }
// Auswahlfrage: markiert richtig/falsch und zeigt die Loesung
function quiz(root){ root.querySelectorAll('.choices').forEach(q=>{ q.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
  q.querySelectorAll('.choice').forEach(x=>x.classList.remove('right','wrong'));
  b.classList.add(b.dataset.ok==='1'?'right':'wrong');
  const wrap=q.closest('.q')||q.parentElement, sol=wrap&&wrap.querySelector('.solution'); if(sol) sol.hidden=false; })); }); }

/* Gemeinsame Magnetismus-Animationen (Teilchenbild: Elementarmagnete) */

function drawMagnet(ctx,x,y,w,h,ang){ ctx.save(); ctx.translate(x+w/2,y+h/2); if(ang) ctx.rotate(ang); ctx.translate(-(x+w/2),-(y+h/2));
  ctx.fillStyle='#e5533c'; rr(ctx,x,y,w/2,h,5); ctx.fill(); ctx.fillStyle='#2f6df6'; rr(ctx,x+w/2,y,w/2,h,5); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(h*0.5)+'px "Segoe UI",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('N',x+w*0.25,y+h/2); ctx.fillText('S',x+w*0.75,y+h/2); ctx.restore(); }

function magArrow(ctx,cx,cy,ang,L,col){ col=col||'#3a4256'; const dx=Math.cos(ang)*L, dy=Math.sin(ang)*L, h=L*0.6;
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cx-dx,cy-dy); ctx.lineTo(cx+dx,cy+dy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+dx,cy+dy); ctx.lineTo(cx+dx-h*Math.cos(ang-0.5),cy+dy-h*Math.sin(ang-0.5)); ctx.lineTo(cx+dx-h*Math.cos(ang+0.5),cy+dy-h*Math.sin(ang+0.5)); ctx.closePath(); ctx.fill(); }

// Pol am berührenden Ende hervorheben (Farbring: N rot, S blau)
function poleGlow(ctx,x,y,r,col){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7);
  ctx.fillStyle=col+'22'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=col; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); }

// Zwei Magnete: linker fest, rechter gleitet heran (anziehen) bzw. weg (abstoßen).
// Mit "umdrehen"-Knopf (data-flip) wird von Hand zwischen Anziehen und Abstoßen gewechselt;
// ohne Knopf läuft der Wechsel automatisch. Die treffenden Pole werden hervorgehoben.
function animPoles(root){ const c=root.querySelector('#c-po'); if(!c) return; let t0=0;
  const flipBtn=root.querySelector('[data-flip]'), manual=!!flipBtn;
  let flipped=false, animStart=null;
  if(flipBtn){ flipBtn.addEventListener('click',()=>{ flipped=!flipped; animStart=null;
    flipBtn.classList.toggle('on',flipped); flipBtn.textContent=flipped?'Wieder zurückdrehen':'Rechten Magneten umdrehen'; }); }
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; let attract, ease;
    if(manual){ if(animStart===null) animStart=ts; const p=Math.min(1,(ts-animStart)/900); ease=1-Math.pow(1-p,3); attract=!flipped; }
    else { const cyc=8, t=((ts-t0)/1000)%cyc; attract=t<cyc/2; const p=Math.min(1,(attract?t:t-cyc/2)/3.2); ease=1-Math.pow(1-p,3); }
    ctx.clearRect(0,0,W,H);
    const mw=W*0.24, mh=H*0.2, y=H*0.42, Lx=W*0.12;
    const gNear=W*0.03, gFar=W*0.26, gap=attract?(gFar-(gFar-gNear)*ease):(gNear+(gFar-gNear)*ease), Rx=Lx+mw+gap;
    drawMagnet(ctx,Lx,y,mw,mh,0); drawMagnet(ctx,Rx,y,mw,mh,attract?0:Math.PI);
    const ey=y+mh/2, gr=mh*0.62;
    poleGlow(ctx,Lx+mw,ey,gr,'#2f6df6');                    // rechtes Ende des linken Magneten = Südpol
    poleGlow(ctx,Rx,ey,gr,attract?'#e5533c':'#2f6df6');     // linkes Ende des rechten Magneten: N beim Anziehen, S beim Abstoßen
    const gm=(Lx+mw+Rx)/2, ay=y+mh/2, rc=Rx+mw/2;
    if(attract){ magArrow(ctx,gm-20,ay,0,10,'#25b071'); magArrow(ctx,gm+20,ay,Math.PI,10,'#25b071');
      magArrow(ctx,rc,y-16,Math.PI,14,'#177a4d');
      lbl(ctx,W/2,y-46,'ungleiche Pole (N–S) ziehen sich an',15,'#177a4d');
      lbl(ctx,W/2,y+mh+24,'Der rechte Magnet wird herangezogen.',13,'#5a6684'); }
    else { magArrow(ctx,gm-26,ay,Math.PI,10,'#e5533c'); magArrow(ctx,gm+26,ay,0,10,'#e5533c');
      magArrow(ctx,rc,y-16,0,14,'#b23a26');
      lbl(ctx,W/2,y-46,'gleiche Pole (S–S) stoßen sich ab',15,'#b23a26');
      lbl(ctx,W/2,y+mh+24,'Der rechte Magnet wird weggedrückt.',13,'#5a6684'); }
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Standbild zweier Magnete (N–S), zum Bebildern von Textabschnitten
function polePairStill(root){ const c=root.querySelector('#c-ps'); if(!c) return;
  stopRAF(); RAF=requestAnimationFrame(()=>{ const {ctx,W,H}=fit(c); ctx.clearRect(0,0,W,H);
    const mw=W*0.3, mh=H*0.34, y=(H-mh)/2, gap=W*0.06, Lx=(W-(2*mw+gap))/2, Rx=Lx+mw+gap;
    drawMagnet(ctx,Lx,y,mw,mh,0); drawMagnet(ctx,Rx,y,mw,mh,0);
    poleGlow(ctx,Lx+mw,y+mh/2,mh*0.5,'#2f6df6'); poleGlow(ctx,Rx,y+mh/2,mh*0.5,'#e5533c');
    lbl(ctx,W/2,y-16,'Nordpol und Südpol stehen sich gegenüber',14,'#177a4d'); }); }

// Magnet-Test: Gegenstände antippen oder per Knopf wählen. Eisen, Nickel, Kobalt werden
// angezogen (gleiten zum Magneten), andere Stoffe bleiben liegen.
function animAttract(root){ const c=root.querySelector('#c-at'); if(!c) return; c.style.touchAction='none';
  const items=[
    {name:'Eisennagel',   mag:1, str:'stark',   col:'#8b93a7'},
    {name:'Büroklammer',  mag:1, str:'stark',   col:'#8b93a7'},
    {name:'Nickel-Münze', mag:1, str:'schwach', col:'#caa76a'},
    {name:'Kobalt-Stück', mag:1, str:'schwach', col:'#6f86bb'},
    {name:'Alu-Stück',    mag:0, col:'#b9c0cc'},
    {name:'Holzklotz',    mag:0, col:'#cdb28a'}
  ];
  const st=items.map(()=>({p:0,target:0,shake:0,tried:false}));
  let W0=600,H0=360,last=0; const btns=[];
  const pick=i=>{ st.forEach((s,k)=>{ s.target=(k===i && items[k].mag)?1:0; }); const s=st[i];
    s.tried=true; if(!items[i].mag) s.shake=1; btns.forEach((b,k)=>{ if(b) b.classList.toggle('on',k===i); }); };
  const geom=(W,H)=>{ const mx=W*0.06, mw=W*0.12, my=H*0.16, mh=H*0.7, restX=W*0.6;
    return {mx,mw,my,mh,restX, endX:mx+mw+24, rowH:mh/items.length}; };
  const itemPos=(i,W,H)=>{ const g=geom(W,H), y=g.my+g.rowH*(i+0.5);
    const x=g.restX-(g.restX-g.endX)*st[i].p + (st[i].shake>0?Math.sin(st[i].shake*40)*6:0); return {x,y,w:52,h:24}; };
  const toXY=e=>{ const r=c.getBoundingClientRect(); return [ (e.clientX-r.left)*(W0/r.width), (e.clientY-r.top)*(H0/r.height) ]; };
  c.addEventListener('pointerdown',e=>{ const [x,y]=toXY(e);
    for(let i=0;i<items.length;i++){ const P=itemPos(i,W0,H0);
      if(x>=P.x-6&&x<=P.x+P.w+6&&y>=P.y-P.h/2-6&&y<=P.y+P.h/2+6){ pick(i); e.preventDefault(); break; } } });
  const modeBox=root.querySelector('.modes');
  if(modeBox) modeBox.querySelectorAll('[data-item]').forEach(b=>{ btns[+b.dataset.item]=b; b.addEventListener('click',()=>pick(+b.dataset.item)); });
  const loop=ts=>{ const {ctx,W,H}=fit(c); W0=W;H0=H; if(!last)last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    st.forEach(s=>{ s.p+=(s.target-s.p)*Math.min(1,dt*5); if(s.shake>0) s.shake=Math.max(0,s.shake-dt*2); });
    ctx.clearRect(0,0,W,H); const g=geom(W,H);
    ctx.fillStyle='#e5533c'; rr(ctx,g.mx,g.my,g.mw,g.mh/2,4); ctx.fill(); ctx.fillStyle='#2f6df6'; rr(ctx,g.mx,g.my+g.mh/2,g.mw,g.mh/2,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(g.mw*0.45)+'px "Segoe UI",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';

      rr(ctx,P.x,P.y-P.h/2,P.w,P.h,5); ctx.fill(); ctx.stroke();
      let cap=it.name; if(st[i].tried) cap += it.mag?('  – wird '+it.str+' angezogen'):'  – bleibt liegen';
      lbl(ctx,P.x+P.w+8,P.y,cap,13, st[i].tried?(it.mag?'#177a4d':'#b23a26'):'#5a6684','left'); });
    lbl(ctx,W/2,H*0.06,'Eisen wird stark, Nickel und Kobalt schwächer angezogen – andere Stoffe nicht',14,'#5a6684');
    RAF=requestAnimationFrame(loop); };

// Kleines Sortierspiel: jeden Gegenstand als magnetisch / nicht magnetisch einordnen.
function magnetSort(root){ const wrap=root.querySelector('#sortgame'); if(!wrap) return;
  const rows=[...wrap.querySelectorAll('.sortitem')], score=wrap.querySelector('#sortscore');
  const tally=()=>{ const done=rows.filter(r=>r.dataset.done==='1').length; if(score) score.textContent='Richtig einsortiert: '+done+' von '+rows.length; };

    else  { r.dataset.done='0'; r.style.background='#fdeeeb'; r.style.borderColor='#e5533c'; if(v){ v.textContent='✗ nochmal überlegen'; v.style.color='#b23a26'; } }
    tally(); })); });

// Elementarmagnete: mit Knöpfen (data-stroke / data-scramble) oder Wischen bedienbar.
// Streichen richtet schrittweise aus, Erschüttern/Erhitzen bringt durcheinander.
// Ohne Knöpfe läuft der Wechsel automatisch.
function animElementary(root){ const c=root.querySelector('#c-el'); if(!c) return; let t0=0, seed=13;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const cols=8, rows=3, N=cols*rows; let base=[]; for(let i=0;i<N;i++) base.push(rnd()*6.283);
  const strokeBtn=root.querySelector('[data-stroke]'), scrBtn=root.querySelector('[data-scramble]'), manual=!!(strokeBtn||scrBtn);
  let align=0, disp=0, sx=null; c.style.touchAction='none';
  if(strokeBtn) strokeBtn.addEventListener('click',()=>{ align=Math.min(1,align+0.25); });
  if(scrBtn) scrBtn.addEventListener('click',()=>{ align=0; base=base.map(()=>rnd()*6.283); });
  c.addEventListener('pointerdown',e=>{ sx=e.clientX; });
  c.addEventListener('pointermove',e=>{ if(sx===null) return; const dx=e.clientX-sx; if(Math.abs(dx)>36){ align=Math.min(1,align+0.09); sx=e.clientX; } });
  const endp=()=>{ sx=null; }; c.addEventListener('pointerup',endp); c.addEventListener('pointercancel',endp); c.addEventListener('pointerleave',endp);
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; let p;
    if(manual){ disp+=(align-disp)*0.08; p=disp; } else { const tt=t%6; p=tt<3?0:Math.min(1,(tt-3)/1.5); }
    ctx.clearRect(0,0,W,H); const x0=W*0.14, y0=H*0.3, w=W*0.72, h=H*0.4;
    ctx.strokeStyle='#6f83ab'; ctx.lineWidth=2; ctx.fillStyle='#eef1f7'; rr(ctx,x0,y0,w,h,8); ctx.fill(); ctx.stroke();
    const ax=w/cols, ay=h/rows, L=Math.min(ax,ay)*0.3;
    for(let ri=0;ri<rows;ri++)for(let ci=0;ci<cols;ci++){ const idx=ri*cols+ci, cx=x0+ax*(ci+0.5), cy=y0+ay*(ri+0.5);
      const ang=base[idx]*(1-p)+Math.sin(t*3+idx)*0.12*(1-p); magArrow(ctx,cx,cy,ang,L,'#e5533c'); }
    lbl(ctx,W/2,y0-12,p<0.5?'ungeordnet – der Stab ist kein Magnet':'ausgerichtet – jetzt ein Magnet',15,p<0.5?'#5a6684':'#b23a26');
    if(p>0.8){ lbl(ctx,x0-6,y0+h/2,'S',20,'#2f6df6','right'); lbl(ctx,x0+w+6,y0+h/2,'N',20,'#e5533c','left'); }
    energyBar(ctx,x0,y0+h+24,w,p,'#e5533c','ausgerichtet: '+Math.round(p*100)+' %  →  '+(p<0.2?'kein Magnet':p<0.6?'schwacher Magnet':'starker Magnet'));
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Zersägen: aus einem Magneten werden zwei Stücke, jedes wieder mit Nord- und Südpol.
function animSaw(root){ const c=root.querySelector('#c-sw'); if(!c) return; let t0=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const cyc=6, t=((ts-t0)/1000)%cyc; ctx.clearRect(0,0,W,H);
    const mw=W*0.5, mh=Math.max(30,H*0.24), y=(H-mh)/2, x=(W-mw)/2, hw=mw/2, cx=x+mw/2;
    if(t<2.4){ drawMagnet(ctx,x,y,mw,mh,0);
      const saw=Math.min(1,t/2); ctx.strokeStyle='#5a6684'; ctx.setLineDash([5,4]); ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(cx,y-22); ctx.lineTo(cx,y-22+(mh+44)*saw); ctx.stroke(); ctx.setLineDash([]);
      lbl(ctx,W/2,y-34,'Ein Stabmagnet wird in der Mitte zersägt',14,'#5a6684'); }
    else { const p=Math.min(1,(t-2.4)/2), off=mw*0.14*(1-Math.pow(1-p,3));
      drawMagnet(ctx,x-off,y,hw,mh,0); drawMagnet(ctx,x+hw+off,y,hw,mh,0);
      lbl(ctx,W/2,y-34,'Jedes Stück hat wieder einen Nord- und einen Südpol',14,'#b23a26'); }
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Feldlinien um einen Stabmagneten (statisch)
function drawField(root){ const c=root.querySelector('#c-fi'); if(!c) return; stopRAF(); RAF=requestAnimationFrame(()=>{ const {ctx,W,H}=fit(c); ctx.clearRect(0,0,W,H);
    const mw=W*0.36, mh=H*0.15, mx=(W-mw)/2, my=(H-mh)/2, nX=mx, sX=mx+mw, cy=my+mh/2;
    ctx.strokeStyle='#7fb0ff'; ctx.lineWidth=2;
    for(const off of [1.1,2.0,3.1]){ const dy=mh*off;
      ctx.beginPath(); ctx.moveTo(nX,cy); ctx.bezierCurveTo(nX-mw*0.15,cy-dy,sX+mw*0.15,cy-dy,sX,cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(nX,cy); ctx.bezierCurveTo(nX-mw*0.15,cy+dy,sX+mw*0.15,cy+dy,sX,cy); ctx.stroke(); }
    drawMagnet(ctx,mx,my,mw,mh,0);
    lbl(ctx,W/2,H*0.92,'Feldlinien: außen vom Nordpol zum Südpol',14,'#5a6684'); }); }

// Feld an einer Stelle (Summe über alle Pole)
function fieldAt(poles,x,y){ let fx=0,fy=0; for(const p of poles){ const dx=x-p.x, dy=y-p.y, r2=dx*dx+dy*dy+90, r=Math.sqrt(r2), inv=p.q/(r2*r)*1e4; fx+=dx*inv; fy+=dy*inv; } return {fx,fy}; }

// Zusammenhängende Feldlinien: von den Nordpolen aus dem Feld folgen
function drawStreamlines(ctx,poles,W,H){ ctx.strokeStyle='#2f6df6'; ctx.lineWidth=2;
  const seeds=[]; poles.forEach(p=>{ if(p.q>0){ for(let k=0;k<10;k++){ const a=k/10*6.283; seeds.push([p.x+Math.cos(a)*10,p.y+Math.sin(a)*10]); } } });
  for(const s of seeds){ let x=s[0],y=s[1]; ctx.beginPath(); ctx.moveTo(x,y);
    for(let n=0;n<200;n++){ const f=fieldAt(poles,x,y), m=Math.hypot(f.fx,f.fy); if(m<1e-9) break; x+=f.fx/m*4; y+=f.fy/m*4; ctx.lineTo(x,y);
      if(x<-20||x>W+20||y<-20||y>H+20) break; let hit=false; for(const p of poles){ if(p.q<0&&Math.hypot(x-p.x,y-p.y)<9){hit=true;break;} } if(hit) break; }
    ctx.stroke(); } }

// Kleiner Kompass: rote Nadel zeigt in Feldrichtung
function drawCompass(ctx,x,y,r,f){ const ang=Math.atan2(f.fy,f.fx);
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fillStyle='rgba(247,250,255,.92)'; ctx.fill(); ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=2; ctx.stroke();
  const nx=Math.cos(ang), ny=Math.sin(ang), l=r*0.8; ctx.lineCap='round'; ctx.lineWidth=Math.max(3,r*0.16);
  ctx.strokeStyle='#e5533c'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+nx*l,y+ny*l); ctx.stroke();
  ctx.strokeStyle='#2f6df6'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-nx*l,y-ny*l); ctx.stroke(); ctx.lineCap='butt';
  ctx.fillStyle='#3a4256'; ctx.beginPath(); ctx.arc(x,y,r*0.12,0,7); ctx.fill(); ctx.restore(); }

// Feld-Spielwiese: Magnete per Finger verschieben, Feld rechnet live neu.
// Umschalter Eisenspäne <-> Feldlinien (data-view), ziehbarer Kompass, Feldstärke über Farbe/Deckkraft.
function magnetLab(root){ const c=root.querySelector('#c-ml'); if(!c) return; c.style.touchAction='none';
  const mags=[{x:0,y:0,a:0},{x:0,y:0,a:Math.PI}]; let init=false, drag=-1, dragC=false, dox=0, doy=0, lastW=600, lastH=380;
  const comp={x:0,y:0}; let view='spaene';
  root.querySelectorAll('[data-rot]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.rot; if(mags[i]) mags[i].a+=Math.PI/6; }));
  root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{ view=b.dataset.view; root.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x===b)); }));
  const toXY=e=>{ const r=c.getBoundingClientRect(); return [ (e.clientX-r.left)*(lastW/r.width), (e.clientY-r.top)*(lastH/r.height) ]; };
  c.addEventListener('pointerdown',e=>{ const [x,y]=toXY(e);
    if(Math.hypot(comp.x-x,comp.y-y)<lastW*0.09){ dragC=true; dox=comp.x-x; doy=comp.y-y; try{c.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); return; }
    let best=-1,bd=1e9; mags.forEach((m,i)=>{ const d=Math.hypot(m.x-x,m.y-y); if(d<bd){bd=d;best=i;} });
    if(bd<lastW*0.14){ drag=best; dox=mags[best].x-x; doy=mags[best].y-y; try{c.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); } });
  c.addEventListener('pointermove',e=>{ if(drag<0&&!dragC) return; const [x,y]=toXY(e);
    if(dragC){ comp.x=Math.max(lastW*0.04,Math.min(lastW*0.96,x+dox)); comp.y=Math.max(lastH*0.06,Math.min(lastH*0.94,y+doy)); }
    else { mags[drag].x=Math.max(lastW*0.08,Math.min(lastW*0.92,x+dox)); mags[drag].y=Math.max(lastH*0.12,Math.min(lastH*0.86,y+doy)); } e.preventDefault(); });
  const end=()=>{ drag=-1; dragC=false; }; c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end);
  const loop=ts=>{ const {ctx,W,H}=fit(c); lastW=W; lastH=H;
    if(!init){ mags[0].x=W*0.36; mags[0].y=H*0.46; mags[1].x=W*0.64; mags[1].y=H*0.46; comp.x=W*0.5; comp.y=H*0.84; init=true; }
    ctx.clearRect(0,0,W,H);
    const mw=W*0.17, mh=Math.max(26,H*0.11), hl=mw*0.38;
    const poles=[]; mags.forEach(m=>{ poles.push({x:m.x-Math.cos(m.a)*hl,y:m.y-Math.sin(m.a)*hl,q:1}); poles.push({x:m.x+Math.cos(m.a)*hl,y:m.y+Math.sin(m.a)*hl,q:-1}); });
    if(view==='linien'){ drawStreamlines(ctx,poles,W,H); }
    else { const step=Math.max(20,W/24), M0=0.5;
      for(let gx=step*0.6; gx<W; gx+=step) for(let gy=step*0.6; gy<H; gy+=step){
        const f=fieldAt(poles,gx,gy), mag=Math.hypot(f.fx,f.fy); if(mag<1e-4) continue; const ux=f.fx/mag, uy=f.fy/mag;
        const k=mag/(mag+M0), len=step*(0.24+0.22*k), al=0.15+0.75*k, sh=Math.round(150-110*k);
        ctx.strokeStyle='rgba('+sh+','+(sh+8)+','+(sh+30)+','+al.toFixed(3)+')'; ctx.lineWidth=1.4+1.6*k;
        ctx.beginPath(); ctx.moveTo(gx-ux*len,gy-uy*len); ctx.lineTo(gx+ux*len,gy+uy*len); ctx.stroke(); } }
    mags.forEach(m=>drawMagnet(ctx, m.x-mw/2, m.y-mh/2, mw, mh, m.a));
    drawCompass(ctx,comp.x,comp.y,Math.max(16,W*0.045),fieldAt(poles,comp.x,comp.y));
    lbl(ctx, W/2, H-8, view==='linien'?'Feldlinien: außen vom Nordpol zum Südpol':'Eisenspäne: dicht und dunkel = starkes Feld', 13, '#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Erde als großer Magnet mit Feldlinien; die Kompassnadel lässt sich auslenken
// und pendelt gedämpft nach Norden zurück.
function animCompass(root){ const c=root.querySelector('#c-co'); if(!c) return; c.style.touchAction='none';
  let t0=0, ang=-Math.PI/2, vel=0, dragging=false, cx=0, cy=0, R=0, lastW=600, lastH=360;
  const toXY=e=>{ const r=c.getBoundingClientRect(); return [ (e.clientX-r.left)*(lastW/r.width), (e.clientY-r.top)*(lastH/r.height) ]; };
  c.addEventListener('pointerdown',e=>{ const [x,y]=toXY(e); if(Math.hypot(x-cx,y-cy)<R*1.05){ dragging=true; vel=0; ang=Math.atan2(y-cy,x-cx); try{c.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); } });
  c.addEventListener('pointermove',e=>{ if(!dragging) return; const [x,y]=toXY(e); ang=Math.atan2(y-cy,x-cx); e.preventDefault(); });
  const end=()=>{ dragging=false; }; c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end);
  const loop=ts=>{ const {ctx,W,H}=fit(c); lastW=W; lastH=H; if(!t0)t0=ts;
    cx=W*0.5; cy=H*0.54; R=Math.min(W,H)*0.4; ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#7fb0ff'; ctx.lineWidth=2;
    for(const s of [1.28,1.7,2.2]){ const rx=R*s;
      ctx.beginPath(); ctx.moveTo(cx,cy-R*0.98); ctx.bezierCurveTo(cx+rx,cy-R*0.55,cx+rx,cy+R*0.55,cx,cy+R*0.98); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx,cy-R*0.98); ctx.bezierCurveTo(cx-rx,cy-R*0.55,cx-rx,cy+R*0.55,cx,cy+R*0.98); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fillStyle='#dcecdd'; ctx.fill(); ctx.strokeStyle='#8fb98f'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#5a6684'; rr(ctx,cx-R*0.1,cy-R*0.78,R*0.2,R*1.56,R*0.1); ctx.fill(); ctx.restore();
    lbl(ctx,cx,cy-R+16,'N',16,'#e5533c'); lbl(ctx,cx,cy+R-16,'S',16,'#2f6df6');
    lbl(ctx,cx,cy-R-14,'geografischer Norden',14,'#5a6684');
    if(!dragging){ const target=-Math.PI/2; let d=ang-target; while(d>Math.PI)d-=6.283185; while(d<-Math.PI)d+=6.283185; const acc=-42*d-7*vel; vel+=acc*0.016; ang+=vel*0.016; }
    const nx=Math.cos(ang), ny=Math.sin(ang), l=R*0.62; ctx.lineCap='round'; ctx.lineWidth=Math.max(5,R*0.09);
    ctx.strokeStyle='#e5533c'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+nx*l,cy+ny*l); ctx.stroke();
    ctx.strokeStyle='#2f6df6'; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-nx*l,cy-ny*l); ctx.stroke(); ctx.lineCap='butt';
    ctx.fillStyle='#3a4256'; ctx.beginPath(); ctx.arc(cx,cy,R*0.06,0,7); ctx.fill();
    lbl(ctx,cx,cy+R+20,'Nadel auslenken – sie pendelt zurück nach Norden',14,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Kraft und Abstand: der rechte Magnet wird immer schneller herangezogen, je kleiner der Abstand.
// Der Kraftpfeil über dem Magneten wächst mit 1/Abstand². Nach dem Zusammenstoß beginnt es von vorn.
function animForceDistance(root){ const c=root.querySelector('#c-fd'); if(!c) return;
  let gap=null, vel=0, last=0, hold=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!last)last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    const mw=W*0.22, mh=H*0.2, y=H*0.46, Lx=W*0.08, gMin=W*0.015, gMax=W*0.52;
    if(gap===null){ gap=gMax; vel=0; }
    if(hold>0){ hold-=dt; if(hold<=0){ gap=gMax; vel=0; } }
    else { const acc=(W*W*22)/(gap*gap); vel+=acc*dt; gap-=vel*dt; if(gap<=gMin){ gap=gMin; hold=0.7; } }
    ctx.clearRect(0,0,W,H); const Rx=Lx+mw+gap;
    drawMagnet(ctx,Lx,y,mw,mh,0); drawMagnet(ctx,Rx,y,mw,mh,0);
    const ey=y+mh/2, gr=mh*0.6;
    poleGlow(ctx,Lx+mw,ey,gr,'#2f6df6'); poleGlow(ctx,Rx,ey,gr,'#e5533c');
    const fl=Math.min(mw*0.95, 8+(W*W*0.9)/(gap*gap));
    magArrow(ctx,Rx+mw*0.3,y-16,Math.PI,fl/2,'#177a4d');
    lbl(ctx,W/2,y-42, gap>gMax*0.6?'weit weg: die Kraft ist schwach':(gap<gMax*0.25?'ganz nah: die Kraft ist stark':'näher heran: die Kraft wächst'),15,'#177a4d');
    lbl(ctx,W/2,y+mh+24,'Je kleiner der Abstand, desto stärker zieht der Magnet.',13,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Schwebe-Trick: gleiche Pole zeigen aufeinander (N–N), der obere Magnet schwebt und wippt leicht.
function animLevitate(root){ const c=root.querySelector('#c-lv'); if(!c) return; let t0=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);
    const vMag=(x,yy,w,h,topN)=>{ ctx.fillStyle=topN?'#e5533c':'#2f6df6'; rr(ctx,x,yy,w,h/2,5); ctx.fill();
      ctx.fillStyle=topN?'#2f6df6':'#e5533c'; rr(ctx,x,yy+h/2,w,h/2,5); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(h*0.3)+'px "Segoe UI",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(topN?'N':'S',x+w/2,yy+h*0.25); ctx.fillText(topN?'S':'N',x+w/2,yy+h*0.75); };
    const mw=W*0.4, mh=Math.max(24,H*0.15), x=(W-mw)/2, baseY=H*0.6, gap=H*0.16+Math.sin(t*2)*H*0.02, topY=baseY-gap-mh;
    ctx.fillStyle='#c9d2e6'; rr(ctx,x-8,baseY+mh,mw+16,H*0.07,4); ctx.fill();
    vMag(x,baseY,mw,mh,true); vMag(x,topY,mw,mh,false);
    const midY=(baseY+topY+mh)/2, cx=W/2;
    magArrow(ctx,cx-mw*0.28,midY,-Math.PI/2,9,'#e5533c'); magArrow(ctx,cx+mw*0.28,midY,Math.PI/2,9,'#e5533c');
    lbl(ctx,W/2,topY-22,'Gleiche Pole (N–N) stoßen sich ab',15,'#b23a26');
    lbl(ctx,W/2,H-14,'Darum kann ein Magnet über dem anderen schweben.',13,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Feld wirkt durch nicht-magnetische Stoffe: die Büroklammer wird durch Papier, Hand oder Plastik
// hindurch angezogen und an die Barriere gepresst. Stoff per Knopf (data-mat) wählbar.
function animThroughMaterial(root){ const c=root.querySelector('#c-tp'); if(!c) return;
  const cols={'Papier':'#f3ead3','Hand':'#f0c9a8','Plastik':'#cfe0f5'}; let mat='Papier', t0=0;
  root.querySelectorAll('[data-mat]').forEach(b=>b.addEventListener('click',()=>{ mat=b.dataset.mat; t0=0; root.querySelectorAll('[data-mat]').forEach(x=>x.classList.toggle('on',x===b)); }));
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=((ts-t0)/1000)%4; ctx.clearRect(0,0,W,H);
    const mw=W*0.2, mh=H*0.34, mx=W*0.05, my=(H-mh)/2, magEnd=mx+mw, cly=my+mh/2;
    const bx=W*0.46, bw=W*0.04, by=H*0.14, bh=H*0.72;
    const p=Math.min(1,t/2.2), ease=1-Math.pow(1-p,3), clx=W*0.82-(W*0.82-(bx+bw+16))*ease;
    drawMagnet(ctx,mx,my,mw,mh,0);
    ctx.strokeStyle='rgba(127,176,255,.7)'; ctx.setLineDash([5,4]); ctx.lineWidth=1.6;
    for(const dy of [-H*0.12,0,H*0.12]){ ctx.beginPath(); ctx.moveTo(magEnd,cly); ctx.quadraticCurveTo((magEnd+clx)/2,cly+dy,clx,cly); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.save(); ctx.globalAlpha=0.82; ctx.fillStyle=cols[mat]||'#eee'; rr(ctx,bx,by,bw,bh,4); ctx.fill();
    ctx.strokeStyle='#b7c2dc'; ctx.lineWidth=1.5; rr(ctx,bx,by,bw,bh,4); ctx.stroke(); ctx.restore();
    lbl(ctx,bx+bw/2,by-10,mat,13,'#5a6684');
    ctx.fillStyle='#9aa8c6'; ctx.strokeStyle='#6f83ab'; ctx.lineWidth=1.5; rr(ctx,clx,cly-12,26,24,5); ctx.fill(); ctx.stroke();
    lbl(ctx,W/2,H*0.06,'Das Feld geht durch '+mat+' – die Büroklammer wird trotzdem angezogen',14,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Hitze und Curie-Idee: mit dem Regler wird der Stab heißer; ab einer bestimmten Temperatur
// zerfällt die Ausrichtung ganz und der Magnetismus geht verloren.
function animCurie(root){ const c=root.querySelector('#c-cu'); if(!c) return;
  const slider=root.querySelector('#curie-temp'), val=root.querySelector('#curie-val');
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const cols=8, rows=3, N=cols*rows, base=[]; for(let i=0;i<N;i++) base.push(rnd()*6.283); let t0=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000;
    const temp=slider?(+slider.value):20; if(val) val.textContent=temp+' °C';
    const align=Math.max(0,Math.min(1,(770-temp)/(770-300))), hot=Math.max(0,Math.min(1,(temp-200)/600));
    ctx.clearRect(0,0,W,H); const x0=W*0.14, y0=H*0.32, w=W*0.72, h=H*0.36;
    ctx.strokeStyle='#6f83ab'; ctx.lineWidth=2; ctx.fillStyle='#eef1f7'; rr(ctx,x0,y0,w,h,8); ctx.fill(); ctx.stroke();
    if(hot>0.05){ ctx.save(); ctx.globalAlpha=0.28*hot; ctx.fillStyle='#ff5a2b'; rr(ctx,x0,y0,w,h,8); ctx.fill(); ctx.restore(); }
    const ax=w/cols, ay=h/rows, L=Math.min(ax,ay)*0.3;
    for(let ri=0;ri<rows;ri++)for(let ci=0;ci<cols;ci++){ const idx=ri*cols+ci, cx=x0+ax*(ci+0.5), cy=y0+ay*(ri+0.5);
      const ang=base[idx]*(1-align)+Math.sin(t*3+idx)*0.12*(1-align); magArrow(ctx,cx,cy,ang,L,'#e5533c'); }
    lbl(ctx,W/2,y0-14, align>0.9?'kalt: ausgerichtet – ein Magnet':align<0.1?'zu heiß: alles durcheinander – kein Magnet mehr':'wird heiß: die Ordnung zerfällt',15, align<0.1?'#b23a26':(align>0.9?'#177a4d':'#b06f00'));
    if(align>0.85){ lbl(ctx,x0-6,y0+h/2,'S',18,'#2f6df6','right'); lbl(ctx,x0+w+6,y0+h/2,'N',18,'#e5533c','left'); }
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Weicheisen vs. Stahl: mit Knopf (data-magnet) den Magneten anlegen/entfernen. Solange er anliegt,
// sind beide ausgerichtet. Ohne Magnet zerfällt Weicheisen wieder, Stahl behält die Ausrichtung.
function animSoftHard(root){ const c=root.querySelector('#c-wh'); if(!c) return;
  const btn=root.querySelector('[data-magnet]'); let applied=true;
  if(btn){ const upd=()=>{ btn.classList.toggle('on',applied); btn.textContent=applied?'Magnet wieder entfernen':'Magnet anlegen'; };
    btn.addEventListener('click',()=>{ applied=!applied; upd(); }); upd(); }
  const cols=6, rows=2, N=cols*rows;
  const mk=s=>{ let r=s; const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;}; const a=[]; for(let i=0;i<N;i++)a.push(rnd()*6.283); return a; };
  const baseSoft=mk(99), baseHard=mk(5); let aSoft=1, aHard=1, last=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!last)last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    aSoft+=((applied?1:0)-aSoft)*Math.min(1,dt*3); aHard+=(1-aHard)*Math.min(1,dt*3);
    ctx.clearRect(0,0,W,H); const w=W*0.6, x0=(W-w)/2, h=H*0.2;
    const bar=(y,label,align,base)=>{ ctx.strokeStyle='#6f83ab'; ctx.lineWidth=2; ctx.fillStyle='#eef1f7'; rr(ctx,x0,y,w,h,8); ctx.fill(); ctx.stroke();
      const ax=w/cols, ay=h/rows, L=Math.min(ax,ay)*0.32;
      for(let ri=0;ri<rows;ri++)for(let ci=0;ci<cols;ci++){ const idx=ri*cols+ci, cx=x0+ax*(ci+0.5), cy=y+ay*(ri+0.5);
        magArrow(ctx,cx,cy,base[idx]*(1-align),L,'#e5533c'); }
      lbl(ctx,x0,y-12,label,14,'#3a4256','left');
      lbl(ctx,x0+w,y-12,align>0.7?'→ magnetisch':align<0.3?'→ nicht magnetisch':'→ …',14,align>0.7?'#177a4d':'#b23a26','right'); };
    bar(H*0.16,'Weicheisen',aSoft,baseSoft); bar(H*0.6,'Stahl',aHard,baseHard);
    lbl(ctx,W/2,H-12, applied?'Der Magnet liegt an und richtet beide aus.':'Ohne Magnet: Weicheisen zerfällt, Stahl bleibt magnetisch.',13,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Späne streuen: auf Knopfdruck (data-scatter) fallen Eisenspäne herab und richten sich entlang
// des Feldes eines Stabmagneten aus. Dicht/dunkel = starkes Feld.
function animFilings(root){ const c=root.querySelector('#c-sp'); if(!c) return;
  let filings=[], anim=0, seeded=false, W0=600, H0=360, last=0;
  const scatter=(W,H)=>{ filings=[]; let s=(Date.now()%9973)+1; const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
    for(let k=0;k<220;k++) filings.push({x:rnd()*W, y:rnd()*H, drop:rnd()*H*0.5}); anim=0; };
  const btn=root.querySelector('[data-scatter]'); if(btn) btn.addEventListener('click',()=>scatter(W0,H0));
  const loop=ts=>{ const {ctx,W,H}=fit(c); W0=W;H0=H; if(!last)last=ts; const dt=Math.min(0.05,(ts-last)/1000); last=ts;
    if(!seeded){ scatter(W,H); seeded=true; }
    anim=Math.min(1,anim+dt/1.1); const ease=1-Math.pow(1-anim,3);
    const mw=W*0.36, mh=H*0.14, mx=(W-mw)/2, my=(H-mh)/2, p=[{x:mx,y:my+mh/2,q:1},{x:mx+mw,y:my+mh/2,q:-1}];
    ctx.clearRect(0,0,W,H);
    filings.forEach(f=>{ const yy=f.y-f.drop*(1-ease); if(yy<-4) return;
      if(f.x>mx-2&&f.x<mx+mw+2&&yy>my-2&&yy<my+mh+2) return;
      const g=fieldAt(p,f.x,yy), m=Math.hypot(g.fx,g.fy); if(m<1e-6) return; const ux=g.fx/m, uy=g.fy/m;
      const k=m/(m+0.5), L=3+5*k, al=(0.18+0.6*k)*ease;
      ctx.strokeStyle='rgba(60,66,86,'+al.toFixed(3)+')'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(f.x-ux*L,yy-uy*L); ctx.lineTo(f.x+ux*L,yy+uy*L); ctx.stroke(); });
    drawMagnet(ctx,mx,my,mw,mh,0);
    lbl(ctx,W/2,H*0.92, anim<1?'Die Späne fallen …':'Die Eisenspäne ordnen sich zu Feldlinien',14,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Hufeisenkörper (U-Form) mit farbigen Polspitzen oben
function drawHorseshoe(ctx,cx,topY,botY,gap,armW){ const nx=cx-gap/2, sx=cx+gap/2;
  ctx.strokeStyle='#9aa8c6'; ctx.lineWidth=armW; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(nx,botY); ctx.lineTo(nx,topY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx,botY); ctx.lineTo(sx,topY); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,botY,gap/2,0,Math.PI,false); ctx.stroke();
  ctx.lineWidth=armW*0.9;
  ctx.strokeStyle='#e5533c'; ctx.beginPath(); ctx.moveTo(nx,topY); ctx.lineTo(nx,topY+armW*1.1); ctx.stroke();
  ctx.strokeStyle='#2f6df6'; ctx.beginPath(); ctx.moveTo(sx,topY); ctx.lineTo(sx,topY+armW*1.1); ctx.stroke();
  ctx.lineCap='butt'; lbl(ctx,nx,topY-armW*0.55,'N',16,'#e5533c'); lbl(ctx,sx,topY-armW*0.55,'S',16,'#2f6df6'); }

// Zwei Magnetformen umschaltbar (data-shape): Stabmagnet oder Hufeisenmagnet, jeweils mit Feldlinien.
function animMagnetShapes(root){ const c=root.querySelector('#c-hs'); if(!c) return; let shape='stab';
  root.querySelectorAll('[data-shape]').forEach(b=>b.addEventListener('click',()=>{ shape=b.dataset.shape; root.querySelectorAll('[data-shape]').forEach(x=>x.classList.toggle('on',x===b)); }));
  const loop=ts=>{ const {ctx,W,H}=fit(c); ctx.clearRect(0,0,W,H);
    if(shape==='stab'){ const mw=W*0.36, mh=H*0.15, mx=(W-mw)/2, my=(H-mh)/2;
      drawStreamlines(ctx,[{x:mx,y:my+mh/2,q:1},{x:mx+mw,y:my+mh/2,q:-1}],W,H);
      drawMagnet(ctx,mx,my,mw,mh,0);
      lbl(ctx,W/2,H*0.93,'Stabmagnet: Feldlinien außen vom Nord- zum Südpol',14,'#5a6684'); }
    else { const cx=W*0.5, gap=W*0.18, armW=Math.max(20,W*0.09), topY=H*0.3, botY=H*0.7;
      drawStreamlines(ctx,[{x:cx-gap/2,y:topY,q:1},{x:cx+gap/2,y:topY,q:-1}],W,H);
      drawHorseshoe(ctx,cx,topY,botY,gap,armW);
      lbl(ctx,W/2,H*0.93,'Hufeisenmagnet: die Pole liegen dicht beieinander',14,'#5a6684'); }
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Abschirmung: ein Eisenring (data-shield an/aus) hält das Feld heraus – innen bleibt es feldfrei,
// der kleine Kompass in der Mitte reagiert dann nicht.
function animShield(root){ const c=root.querySelector('#c-ab'); if(!c) return;
  const btn=root.querySelector('[data-shield]'); let shield=true;
  if(btn){ const upd=()=>{ btn.classList.toggle('on',shield); btn.textContent=shield?'Eisenring entfernen':'Eisenring einsetzen'; };
    btn.addEventListener('click',()=>{ shield=!shield; upd(); }); upd(); }
  const loop=ts=>{ const {ctx,W,H}=fit(c); ctx.clearRect(0,0,W,H);
    const mw=W*0.22, mh=H*0.18, mx=W*0.04, my=(H-mh)/2, poles=[{x:mx,y:my+mh/2,q:1},{x:mx+mw,y:my+mh/2,q:-1}];
    const rX=W*0.7, rY=H*0.5, rR=Math.min(W,H)*0.22, step=Math.max(22,W/22);
    for(let gx=step*0.6; gx<W; gx+=step) for(let gy=step*0.6; gy<H; gy+=step){
      if(shield&&Math.hypot(gx-rX,gy-rY)<rR-6) continue;
      if(gx>mx-2&&gx<mx+mw+2&&gy>my-2&&gy<my+mh+2) continue;
      const f=fieldAt(poles,gx,gy), m=Math.hypot(f.fx,f.fy); if(m<1e-4) continue; const ux=f.fx/m, uy=f.fy/m;
      const k=m/(m+0.5), len=step*(0.22+0.2*k), al=0.15+0.7*k, sh=Math.round(150-110*k);
      ctx.strokeStyle='rgba('+sh+','+(sh+8)+','+(sh+30)+','+al.toFixed(3)+')'; ctx.lineWidth=1.3+1.4*k;
      ctx.beginPath(); ctx.moveTo(gx-ux*len,gy-uy*len); ctx.lineTo(gx+ux*len,gy+uy*len); ctx.stroke(); }
    drawMagnet(ctx,mx,my,mw,mh,0);
    if(shield){ ctx.strokeStyle='#8b93a7'; ctx.lineWidth=Math.max(10,rR*0.28); ctx.beginPath(); ctx.arc(rX,rY,rR,0,7); ctx.stroke();
      lbl(ctx,rX,rY-rR-8,'feldfrei',14,'#177a4d'); }
    drawCompass(ctx,rX,rY,Math.max(14,rR*0.34), shield?{fx:0,fy:-1}:fieldAt(poles,rX,rY));
    lbl(ctx,W/2,H-10, shield?'Der Eisenring hält das Feld heraus – innen bleibt es feldfrei.':'Ohne Ring dringt das Feld überall hin – die Nadel dreht sich.',13,'#5a6684');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

// Inklination: das Erdmagnetfeld läuft nicht waagerecht, sondern taucht schräg in den Boden.
// Eine frei kippbare Neigungsnadel stellt sich entlang des Feldes ein.
function animInclination(root){ const c=root.querySelector('#c-in'); if(!c) return; stopRAF();
  RAF=requestAnimationFrame(()=>{ const {ctx,W,H}=fit(c); ctx.clearRect(0,0,W,H);
    const groundY=H*0.68;
    ctx.fillStyle='#e7ddc9'; ctx.fillRect(0,groundY,W,H-groundY);
    ctx.strokeStyle='#c3b48f'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
    lbl(ctx,W*0.1,groundY+22,'Erdboden',14,'#8a7a52','left');
    const inc=Math.PI*0.22, dx=Math.cos(inc), dy=Math.sin(inc), len=W*0.46;
    for(let k=0;k<6;k++){ const sx=W*0.06, sy=H*0.06+k*H*0.1; arrow(ctx,sx,sy,sx+dx*len,sy+dy*len,'#7fb0ff',2); }
    const px=W*0.74, py=H*0.4, l=W*0.09, nx=Math.cos(inc), ny=Math.sin(inc);
    ctx.lineCap='round'; ctx.lineWidth=6;
    ctx.strokeStyle='#e5533c'; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+nx*l,py+ny*l); ctx.stroke();
    ctx.strokeStyle='#2f6df6'; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-nx*l,py-ny*l); ctx.stroke(); ctx.lineCap='butt';
    ctx.fillStyle='#3a4256'; ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill();
    lbl(ctx,px,py-l-12,'Neigungsnadel',13,'#5a6684');
    lbl(ctx,W/2,H-16,'Das Erdmagnetfeld verläuft schräg und taucht in den Boden ein.',13,'#5a6684'); }); }

// Zugvögel: kleine Vögel ziehen einer Feldlinie entlang – Bild für die Orientierung am Erdmagnetfeld.
function animBirds(root){ const c=root.querySelector('#c-zv'); if(!c) return; let t0=0;
  const loop=ts=>{ const {ctx,W,H}=fit(c); if(!t0)t0=ts; const t=(ts-t0)/1000; ctx.clearRect(0,0,W,H);
    const p0={x:W*0.14,y:H*0.24}, p1={x:W*0.44,y:H*0.08}, p2={x:W*0.6,y:H*0.92}, p3={x:W*0.86,y:H*0.76};
    ctx.strokeStyle='#cfe0ff'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.bezierCurveTo(p1.x,p1.y,p2.x,p2.y,p3.x,p3.y); ctx.stroke(); ctx.setLineDash([]);
    const bez=(u,a,b,cc,d)=>{ const m=1-u; return m*m*m*a+3*m*m*u*b+3*m*u*u*cc+u*u*u*d; }, Nn=4;
    for(let k=0;k<Nn;k++){ const u=((t*0.12)+k/Nn)%1, x=bez(u,p0.x,p1.x,p2.x,p3.x), y=bez(u,p0.y,p1.y,p2.y,p3.y), s=Math.max(7,W*0.016), flap=Math.sin(t*6+k)*0.3;
      ctx.strokeStyle='#3a4256'; ctx.lineWidth=2.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x-s,y+s*(0.3+flap)); ctx.lineTo(x,y-s*0.2); ctx.lineTo(x+s,y+s*(0.3+flap)); ctx.stroke(); ctx.lineCap='butt'; }
    lbl(ctx,W/2,H*0.06,'Zugvögel orientieren sich am Erdmagnetfeld',14,'#5a6684');
    lbl(ctx,W/2,H*0.94,'wie mit einem eingebauten Kompass',13,'#8a93a7');
    RAF=requestAnimationFrame(loop); };
  stopRAF(); RAF=requestAnimationFrame(loop); }

/* ---------- Layout: Simulation und Text nebeneinander ---------- */
// Hat ein Schritt eine Simulation, kommen Canvas + Regler nach links, der Text nach rechts.
// Schritte ohne Canvas bleiben einspaltig mit begrenzter Lesebreite.
function layoutStage(stage){
  const h2=stage.querySelector(':scope > h2');
  const kids=[...stage.children].filter(el=>el!==h2);
  if(!kids.length) return;
  const isViz=el=>el.tagName==='CANVAS'||['ctrl','modes','btnrow','nav','dots'].some(c=>el.classList.contains(c));
  if(kids.some(el=>el.tagName==='CANVAS')){
    const row=document.createElement('div'); row.className='split';
    const L=document.createElement('div'); L.className='col-viz';
    const R=document.createElement('div'); R.className='col-text';
    kids.forEach(el=>(isViz(el)?L:R).appendChild(el));
    row.appendChild(L);
    if(R.children.length) row.appendChild(R); else L.classList.add('solo');
    stage.appendChild(row);
  } else {
    const one=document.createElement('div'); one.className='col-single';
    kids.forEach(el=>one.appendChild(el));
    stage.appendChild(one);
  }
}

/* ---------- Navigation ---------- */
let i=0;
function buildSteps(){ const box=$('#steps'); box.innerHTML='';
  SECTIONS.forEach((s,k)=>{ const b=document.createElement('button'); b.className='step'+(k===i?' on':'');
    b.innerHTML='<span class="n">'+(k+1)+'</span>'+s.step; b.addEventListener('click',()=>go(k)); box.appendChild(b); }); }
function render(){ stopRAF(); if(window.__stopSound) try{ window.__stopSound(); }catch(_){} const s=SECTIONS[i]; $('#stage').innerHTML='<h2>'+s.title+'</h2>'+s.html;
  layoutStage($('#stage'));
  $('#prev').disabled=i===0; $('#next').disabled=i===SECTIONS.length-1;
  buildSteps(); if(s.init) s.init($('#stage')); }
function go(k){ i=Math.max(0,Math.min(SECTIONS.length-1,k)); render(); }
$('#prev').onclick=()=>go(i-1);
$('#next').onclick=()=>go(i+1);
document.title=PAGE.title; $('#tag').textContent=PAGE.area||'Physik'; $('#h1').textContent=PAGE.h1; render();
</script>
