    <div class="cases">
      <div class="case"><h3>Zickzack ablesen</h3><p>Im Zickzack-Bild: Zu welchen Zeiten ist der Körper bei 12 m?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Viermal: bei t = 1 s (hin), bei t = 2,25 s (zurück), bei t = 3,5 s (wieder hin) und am Ende bei t = 6 s. Bei einer Rückfahrt gehören zu einem Ort mehrere Zeiten.</div></div>
      <div class="case"><h3>Wie weit insgesamt?</h3><p>Welche Strecke legt der Körper im Zickzack-Bild insgesamt zurück? Wo ist er am Ende?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>18 m + 12 m + 18 m + 12 m = 60 m. Am Ende ist er aber nur 12 m vom Start entfernt.</div></div>
    </div>` },

 { step:'Punkte ablesen', title:'Werte auf Karopapier ablesen', init:karoLab, html:
   `<style>
      .karo-q{margin:.3rem 0; padding-left:1.4em}
      .karo-q li{margin:.5rem 0; font-weight:600}
      .karo-a{display:block; color:#1f7a34; font-weight:700; margin-top:.15rem}
      .karo-a[hidden]{display:none}
    </style>
    <p>Ein Kästchen nach rechts sind 0,5 s, ein Kästchen nach oben sind 2 m.</p>
    <canvas class="viz" id="c-karo"></canvas>
    <div class="modes">
      <button data-karo="neu">neue Fahrt</button>
      <button data-karo="los">Lösungen</button>
    </div>
    <ol class="karo-q" id="karo-q"></ol>
    <div class="box merke"><span class="lbl">So liest du ab</span>Ort zu einer Zeit: bei der Zeit senkrecht hoch bis zur Linie, dann waagerecht zur s-Achse. Zeit zu einem Ort: vom Ort waagerecht bis zur Linie, dann senkrecht zur t-Achse. Ein Ort kann zu mehreren Zeiten gehören, wenn der Körper zurückfährt.</div>` },

 { step:'Steigung', title:'Die Steigung ist die Geschwindigkeit', init:slopeLab, html:
   `<p>Wie schnell der Körper ist, liest man an der Steigung der Geraden ab: wie viel Strecke (Δs) in einer Zeit (Δt) dazukommt.</p>
    <canvas class="viz" id="c-slope"></canvas>
    <div class="box merke"><span class="lbl">Merke: Δ heißt Änderung</span>Δ (Delta) steht für eine Änderung: <b>Endwert minus Anfangswert</b>. Im Bild ist Δt = 5 s − 2 s = 3 s und Δs = 20 m − 8 m = 12 m.</div>
    <div class="box merke"><span class="lbl">Merke</span>Steigung = <b>Δs / Δt = v</b>. Das ist genau die Geschwindigkeit, jetzt aus dem Diagramm abgelesen.</div>` },

 { step:'Nicht gleichförmig', title:'Wenn sich das Tempo ändert', init:curveLab, html:
   `<p>Ist die Bewegung nicht gleichförmig, wird die s-t-Linie gekrümmt: schneller werdend steigt sie immer steiler an, langsamer werdend wird sie flacher. Die gestrichelte Tangente berührt die Kurve genau an einer Stelle.</p>
    <canvas class="viz" id="c-curve"></canvas>
    <div class="modes">
      <button data-cv="schneller" class="on">wird schneller</button>
      <button data-cv="langsamer">wird langsamer</button>
    </div>
    <div class="box merke"><span class="lbl">Merke</span><b>Gerade</b> = gleichförmig. <b>Gekrümmt</b> = die Geschwindigkeit ändert sich. Die Steigung der Tangente an einer Stelle ist die <b>Momentangeschwindigkeit</b>, also das, was der Tacho in diesem Augenblick zeigt.</div>` },

 { step:'Kein Bild', title:'Das Diagramm ist kein Bild der Straße', init:bildEx, html:
   `<p>Ein Auto fährt auf einer ebenen, geraden Straße vom Start weg und wieder zurück. Das s-t-Diagramm sieht trotzdem aus wie ein Berg.</p>
    <canvas class="viz" id="c-bild"></canvas>
    <div class="box merke"><span class="lbl">Merke</span>Ein s-t-Diagramm ist <b>kein Bild</b> der Strecke oder der Landschaft. Es zeigt, wie weit der Körper zu welcher Zeit vom Start entfernt ist.</div>
    <div class="cases">
      <div class="case"><h3>Fährt das Auto bergauf?</h3><p>Die Linie steigt zuerst an. Heißt das, dass es bergauf geht?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Nein, die Straße ist eben. Die Linie steigt, weil sich das Auto vom Start entfernt: s wird größer.</div></div>
      <div class="case"><h3>Der Gipfel</h3><p>Was passiert am höchsten Punkt der Kurve?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Dort ist das Auto am weitesten vom Start entfernt und steht einen Augenblick (waagerechte Tangente, v = 0). Danach fährt es zurück, s wird kleiner.</div></div>
    </div>` },

 { step:'Selbst zeichnen', title:'Vom Diagramm zur Bewegung', init:zeichnenLab, html:
   `<p>Zeichne ein s-t-Diagramm und lass die Kugel diese Bewegung fahren. Probiere eine Pause, eine schnelle Strecke und eine Rückfahrt.</p>
    <canvas class="viz" id="c-zeich"></canvas>
    <div class="modes">
      <button data-zeich="play">abspielen</button>
      <button data-zeich="clear">löschen</button>
    </div>
    <div class="box merke"><span class="lbl">Merke</span>Waagerechte Stücke: Die Kugel steht. Steile Stücke: Sie fährt schnell. Fallende Stücke: Sie fährt zurück. Senkrecht nach oben geht nicht, dafür müsste sie in null Sekunden eine Strecke schaffen.</div>` },

 { step:'Messversuch', title:'Vom Messwert zum Diagramm', init:messEx, html:
   `<p>Eine Kugel rollt über eine Bahn. Alle 20 cm misst eine Lichtschranke die Zeit seit dem Start.</p>
    <canvas class="viz" id="c-mess"></canvas>
    <div class="modes">
      <button data-mm="eben" class="on">ebene Bahn</button>
      <button data-mm="schief">schiefe Bahn</button>
    </div>
    <div class="modes">
      <button data-mess="neu">neu messen</button>
      <button data-mess="plot">Diagramm zeigen</button>
    </div>
    <table class="cmp" style="margin:.2rem 0"><tbody>
      <tr><th>s in m</th><td>0,2</td><td>0,4</td><td>0,6</td><td>0,8</td><td>1,0</td><td>1,2</td></tr>
      <tr><th>t in s</th><td data-mt>–</td><td data-mt>–</td><td data-mt>–</td><td data-mt>–</td><td data-mt>–</td><td data-mt>–</td></tr>
    </tbody></table>
    <div class="box merke"><span class="lbl">Merke</span>Jedes Wertepaar aus der Tabelle wird ein Punkt im s-t-Diagramm. Auf der ebenen Bahn liegen die Punkte auf einer <b>Geraden</b>: gleichförmig. Auf der schiefen Bahn liegen sie auf einer Kurve, die immer steiler wird: beschleunigt.</div>
    <div class="cases">
      <div class="case"><h3>Ebene Bahn</h3><p>Bestimme aus der Messtabelle die Geschwindigkeit der Kugel.</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Etwa v = Δs / Δt = 1,2 m / 3,0 s = 0,4 m/s. Kleine Abweichungen sind Messfehler. Weil die Punkte auf einer Geraden liegen, ist die Geschwindigkeit überall gleich.</div></div>
      <div class="case"><h3>Schiefe Bahn</h3><p>Woran erkennt man schon in der Tabelle, dass die Kugel schneller wird?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Für die gleichen 20 cm braucht sie immer weniger Zeit: Die Zeitabstände zwischen den Lichtschranken werden kleiner.</div></div>
    </div>` },

 { step:'Eigene Messung', title:'Unsere Messwerte im Diagramm', init:r=>{ eigenLab(r); revealCases(r); }, html:
   `<style>
      .eig{width:5.5em; font:inherit; font-weight:700; padding:.3rem .45rem; border:2px solid var(--line); border-radius:8px; text-align:right; color:var(--ink); background:#fff}
      .eig:focus{outline:none; border-color:#2f6df6}
    </style>
    <p>Messt selbst, zum Beispiel einen Rollwagen, einen Ball oder eine Person, die über den Schulhof geht. Tragt zu jeder Strecke die gemessene Zeit ein. Komma oder Punkt sind beide erlaubt.</p>
    <canvas class="viz" id="c-eigen"></canvas>
    <div class="modes">
      <button data-eig="fit" class="on">Ausgleichsgerade</button>
      <button data-eig="plus">Zeile dazu</button>
      <button data-eig="leer">leeren</button>
      <button data-eig="bsp">Beispielwerte</button>
    </div>
    <table class="cmp" style="margin:.2rem 0"><thead><tr><th>Nr.</th><th>t in s</th><th>s in m</th></tr></thead><tbody id="eigen-rows"></tbody></table>
    <p id="eigen-v" style="font-weight:800;color:#c06a00;margin:.3rem 0"></p>
    <div class="box merke"><span class="lbl">Merke</span>Messwerte streuen immer ein wenig. Die Ausgleichsgerade läuft so durch die Punkte, dass sie möglichst nah an allen liegt. Ihre Steigung ist die Geschwindigkeit.</div>
    <div class="cases">
      <div class="case"><h3>Gleichförmig?</h3><p>Woran erkennst du im Diagramm, ob eure Bewegung gleichförmig war?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Liegen die Punkte ungefähr auf der Geraden, war das Tempo gleich. Liegen sie auf einer Kurve, die steiler oder flacher wird, war die Bewegung schneller oder langsamer werdend.</div></div>
    </div>` },

 { step:'Echte Daten', title:'Usain Bolts Weltrekord', init:boltEx, html:
   `<p>Weltmeisterschaft Berlin 2009: Usain Bolt läuft 100 m in 9,58 s. Gemessen wurde die Zeit ab dem Startschuss alle 10 m.</p>
    <canvas class="viz" id="c-bolt"></canvas>
    <div class="modes">
      <button data-bolt="st" class="on">s-t-Diagramm</button>
      <button data-bolt="v">Tempo je Abschnitt</button>
    </div>
    <table class="cmp" style="margin:.2rem 0"><tbody>
      <tr><th style="white-space:nowrap">s in m</th><td>10</td><td>20</td><td>30</td><td>40</td><td>50</td></tr>
      <tr><th style="white-space:nowrap">t in s</th><td>1,89</td><td>2,88</td><td>3,78</td><td>4,64</td><td>5,47</td></tr>
    </tbody></table>
    <table class="cmp" style="margin:.2rem 0"><tbody>
      <tr><th style="white-space:nowrap">s in m</th><td>60</td><td>70</td><td>80</td><td>90</td><td>100</td></tr>
      <tr><th style="white-space:nowrap">t in s</th><td>6,29</td><td>7,10</td><td>7,92</td><td>8,75</td><td>9,58</td></tr>
    </tbody></table>
    <div class="cases">
      <div class="case"><h3>Wo beschleunigt Bolt?</h3><p>Woran erkennst du im Diagramm und in der Tabelle, wo er schneller wird?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Auf den ersten 30 bis 40 m: Die Kurve wird steiler, und für jeweils 10 m braucht er immer weniger Zeit. Danach ist die Linie fast gerade, er läuft mit fast gleichem Tempo von etwa 12 m/s.</div></div>
      <div class="case"><h3>Durchschnitt</h3><p>Bestimme seine Durchschnittsgeschwindigkeit in m/s und in km/h.</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>v = 100 m / 9,58 s ≈ 10,4 m/s. Mal 3,6 ergibt das etwa 37,6 km/h.</div></div>
      <div class="case"><h3>Am schnellsten</h3><p>In welchem Abschnitt ist er am schnellsten, und wie schnell ist er dort?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Zwischen 60 m und 70 m: 10 m in 0,81 s, also etwa 12,3 m/s. Das sind rund 44 km/h.</div></div>
    </div>` },

 { step:'Mehr Beispiele', title:'Eine ganze Fahrt lesen', init:journeyEx, html:
   `<p>Auch eine Fahrt mit mehreren Abschnitten steckt in einer Kurve: erst hin, dann Pause, dann zurück.</p>
    <canvas class="viz" id="c-journey"></canvas>
    <div class="box frage"><span class="lbl">Denk nach</span>Woran erkennst du im Diagramm, dass der Körper zurückfährt?</div>
    <p class="lead">Lies die Diagramme. Erst überlegen, dann aufdecken.</p>
    <div class="cases">
      <div class="case"><h3>Zwei Geraden</h3><p>Im s-t-Diagramm sind zwei steigende Geraden: eine steil, eine flach. Welche gehört zum schnelleren Körper?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Die steilere Gerade. Größere Steigung Δs/Δt bedeutet größere Geschwindigkeit.</div></div>
      <div class="case"><h3>Waagerechtes Stück</h3><p>Eine s-t-Linie steigt, wird dann für einige Sekunden waagerecht und steigt danach weiter. Was passiert im waagerechten Stück?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Der Ort ändert sich nicht, der Körper macht eine Pause (v = 0).</div></div>
      <div class="case"><h3>Linie fällt</h3><p>Nach dem höchsten Punkt fällt die s-t-Linie wieder auf null. Was bedeutet das?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Die Strecke s wird wieder kleiner: Der Körper fährt zum Start zurück.</div></div>
      <div class="case"><h3>Steigung ablesen</h3><p>Eine Gerade steigt in 5 s um 40 m. Wie schnell ist der Körper?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>v = Δs/Δt = 40 m / 5 s = 8 m/s.</div></div>
    </div>` },

 { step:'Treffpunkt', title:'Wann und wo treffen sie sich?', init:r=>{ treffLab(r); revealCases(r); }, html:
   `<p>Zwei Fahrzeuge im selben s-t-Diagramm. Wo sich die Linien schneiden, sind beide zur selben Zeit am selben Ort.</p>
    <canvas class="viz" id="c-treff"></canvas>
    <div class="modes">
      <button data-tr="einholen" class="on">Einholen</button>
      <button data-tr="gegen">Gegenverkehr</button>
    </div>
    <div class="ctrl"><label>Tempo B</label><input type="range" id="treff-v" min="2" max="12" step="1" value="8"><span class="val" id="treff-vv">8 m/s</span></div>
    <div class="box merke"><span class="lbl">Merke</span>Der Schnittpunkt zweier s-t-Linien ist der Treffpunkt. Nach unten abgelesen ergibt er die Zeit, nach links den Ort.</div>
    <div class="cases">
      <div class="case"><h3>Nachrechnen</h3><p>Einholen mit B = 8 m/s: Prüfe mit einer Rechnung, dass sich A und B nach 6 s treffen.</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>A ist nach 6 s bei 4 m/s · 6 s = 24 m. B fährt erst ab 3 s, also 3 s lang: 8 m/s · 3 s = 24 m. Beide sind bei 24 m.</div></div>
      <div class="case"><h3>Zu langsam</h3><p>Stelle B auf 4 m/s. Warum gibt es beim Einholen keinen Treffpunkt?</p>
        <button class="reveal">Antwort zeigen</button><div class="res" hidden>Beide Linien haben dieselbe Steigung und laufen parallel. B bleibt immer 3 s hinter A und holt den Abstand nie auf.</div></div>
    </div>` },

 { step:'Einordnung', title:'s-t und v-t nebeneinander', init:dualLab, html:
   `<p>Dieselbe gleichförmige Bewegung sieht in beiden Diagrammen anders aus: im s-t eine steigende Gerade, im v-t eine waagerechte Linie (das Tempo bleibt ja gleich).</p>
    <canvas class="viz" id="c-dual"></canvas>
    <div class="box merke"><span class="lbl">Merke</span>Nicht verwechseln: <b>s-t</b> zeigt den Ort, <b>v-t</b> zeigt die Geschwindigkeit. Das v-t-Diagramm brauchst du in der nächsten Stunde (Beschleunigung).</div>` },

 { step:'Übungen', title:'s-t-Diagramme lesen und zeichnen', init:stUebung, html:
   `<canvas class="viz" id="c-stu"></canvas>
    <div class="modes">
      <button data-stul="leicht" class="on">leicht</button>
      <button data-stul="mittel">mittel</button>
      <button data-stul="schwer">schwer</button>
    </div>
    <div class="box"><div id="stu-q" style="margin:.2rem 0;font-weight:600"></div><div id="stu-a" style="margin:.3rem 0 0;color:#1f7a34;font-weight:600" hidden></div></div>
    <div class="modes">
      <button data-stu="new">neue Aufgabe</button>
      <button data-stu="solve">Lösung</button>
    </div>
    <div class="box merke"><span class="lbl">So liest du</span>Geschwindigkeit = Steigung = Δs / Δt. Waagerecht: Der Körper steht. Fällt die Linie, wird s kleiner: Der Körper fährt zurück.</div>` },

 { step:'Ins Heft', title:'Das schreibst du ab', html:
   `<div class="heft">
      <h3>Das s-t-Diagramm</h3>
      <p>Nach rechts die Zeit t, nach oben die zurückgelegte Strecke s.</p>
      <svg viewBox="0 0 270 130" width="270" height="130">
        <path d="M30 8 L30 112 L212 112" stroke="#5a6684" stroke-width="2" fill="none"/>
        <text x="214" y="124" font-size="12" fill="#5a6684">t</text><text x="36" y="14" font-size="12" fill="#5a6684">s</text>
        <path d="M30 112 L196 18" stroke="#2f6df6" stroke-width="3"/><text x="200" y="20" font-size="12" fill="#1f4fc4">schnell</text>
        <path d="M30 112 L196 78" stroke="#2f6df6" stroke-width="3"/><text x="200" y="80" font-size="12" fill="#1f4fc4">langsam</text>
        <path d="M30 56 L196 56" stroke="#2f6df6" stroke-width="3"/><text x="200" y="59" font-size="12" fill="#1f4fc4">steht</text>
      </svg>
      <ul>
        <li>Waagerecht: Der Körper steht.</li>
        <li>Gerade: gleichförmig. Je steiler, desto schneller.</li>
        <li>Gekrümmt: Das Tempo ändert sich. Fällt die Linie, fährt der Körper zurück.</li>
      </ul>
      <p class="f">v = Δs / Δt &nbsp;(Steigung)</p>
      <p>Δ heißt Änderung: Endwert minus Anfangswert. Bei einer Kurve liefert die Steigung der Tangente die Momentangeschwindigkeit.</p>
      <p class="bsp">Beispiel: Eine Gerade steigt in 3 s um 12 m. v = 12 m / 3 s = 4 m/s.</p>
    </div>
    <p class="ueben-links">Zum Üben: <a href="blaetter/geschwindigkeit/geschwindigkeit.pdf">Arbeitsblatt Geschwindigkeit (PDF)</a> · <a href="training.html">Fit für die Arbeit</a></p>` },

 { step:'Seid ihr fit?', title:'Jetzt du', init:quiz, html:
   `<div class="q"><p>Eine waagerechte Linie im s-t-Diagramm bedeutet:</p>
     <div class="choices">
       <button class="choice" data-ok="1">Der Körper steht.</button>
       <button class="choice" data-ok="0">Der Körper ist sehr schnell.</button>
       <button class="choice" data-ok="0">Der Körper beschleunigt.</button>
     </div>
     <div class="solution" hidden><div class="box merke"><span class="lbl">Auflösung</span>Der Ort ändert sich nicht, der Körper steht.</div></div></div>
    <div class="q"><p>Welche Linie gehört zu einem Körper, der schneller wird?</p>
     <div class="choices">
       <button class="choice" data-ok="1">eine nach oben gekrümmte Kurve (immer steiler)</button>
       <button class="choice" data-ok="0">eine gerade Linie</button>
       <button class="choice" data-ok="0">eine waagerechte Linie</button>
     </div>
     <div class="solution" hidden><div class="box merke"><span class="lbl">Auflösung</span>Wird das Tempo größer, steigt die Kurve immer steiler → gekrümmt.</div></div></div>
    <div class="q"><p>Eine Gerade steigt in 3 s um 12 m. Wie groß ist die Geschwindigkeit?</p>
     <div class="choices">
       <button class="choice" data-ok="1">4 m/s</button>
       <button class="choice" data-ok="0">36 m/s</button>
       <button class="choice" data-ok="0">15 m/s</button>
     </div>
     <div class="solution" hidden><div class="box merke"><span class="lbl">Auflösung</span>v = Δs / Δt = 12 m / 3 s = 4 m/s.</div></div></div>
    <div class="q"><p>Im v-t-Diagramm ist eine waagerechte Linie über null zu sehen. Wie bewegt sich der Körper?</p>
     <div class="choices">
       <button class="choice" data-ok="1">gleichförmig, mit konstanter Geschwindigkeit</button>
       <button class="choice" data-ok="0">er steht</button>
       <button class="choice" data-ok="0">er wird immer schneller</button>
     </div>
     <div class="solution" hidden><div class="box merke"><span class="lbl">Auflösung</span>Im v-t-Diagramm heißt waagerecht über null: v bleibt gleich → gleichförmige Bewegung.</div></div></div>
    <div class="q"><p>Zwei Geraden im s-t-Diagramm: A ist steiler als B. Wer ist schneller?</p>
     <div class="choices">
       <button class="choice" data-ok="1">A</button>
       <button class="choice" data-ok="0">B</button>
       <button class="choice" data-ok="0">beide gleich schnell</button>
     </div>
     <div class="solution" hidden><div class="box merke"><span class="lbl">Auflösung</span>Größere Steigung = größere Geschwindigkeit. A ist steiler, also schneller.</div></div></div>` },

 { step:'Lösung', title:'Die Transferfragen gelöst', init:transferTabs, html:
   `<div class="modes">
      <button data-tf="1" class="on">Transferfrage 1</button>
      <button data-tf="2">Transferfrage 2</button>
    </div>
    <div data-tf-tab="1">
    <div class="box frage"><span class="lbl">Transferfrage 1</span>Lena und Tom fahren mit dem Rad zur 2400 m entfernten Schule. Lena startet um 7:30 Uhr und fährt gleichförmig mit 4 m/s. Tom startet am selben Ort um 7:32 Uhr und fährt mit 6 m/s. Holt Tom Lena noch vor der Schule ein? Wenn ja: wann und wo?</div>
    <div class="cases" style="grid-template-columns:1fr">
      <div class="case"><h3>Schritt 1: Eine Zeit für beide</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Die Zeit t zählt ab 7:30 Uhr in Sekunden. Lena: s = 4 m/s · t. Tom startet 120 s später: s = 6 m/s · (t − 120 s).</div></div>
      <div class="case"><h3>Schritt 2: Im Diagramm</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Lena ist eine Gerade durch den Ursprung. Tom ist eine steilere Gerade, die bei t = 120 s auf der Zeitachse beginnt. Wo sich beide schneiden, sind sie zur selben Zeit am selben Ort.</div></div>
      <div class="case"><h3>Schritt 3: Rechnen</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Gleicher Ort: 4 · t = 6 · (t − 120). Also 4t = 6t − 720, damit 2t = 720 und t = 360 s. Lena ist dann 4 m/s · 360 s = 1440 m weit.</div></div>
      <div class="case"><h3>Schritt 4: Antwort</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Ja. Nach 360 s, also um 7:36 Uhr, holt Tom Lena nach 1440 m ein. Das sind 960 m vor der Schule.</div></div>
    </div>
    </div>
    <div data-tf-tab="2" style="display:none">
    <div class="box frage"><span class="lbl">Transferfrage 2</span>Eine Wanderin startet um 8 Uhr im Tal und ist um 16 Uhr auf dem Gipfel. Am nächsten Tag startet sie um 8 Uhr am Gipfel und steigt auf demselben Weg ab, mal schneller, mal langsamer, mit Pausen. Um 16 Uhr ist sie wieder im Tal. Gibt es eine Stelle auf dem Weg, an der sie an beiden Tagen zur selben Uhrzeit war? Begründe mit einem s-t-Diagramm.</div>
    <div class="cases" style="grid-template-columns:1fr">
      <div class="case"><h3>Schritt 1: Beide Tage in ein Diagramm</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Nach rechts die Uhrzeit von 8 bis 16 Uhr, nach oben der Weg s vom Tal aus. Tag 1 beginnt unten bei s = 0 und endet oben am Gipfel. Tag 2 beginnt oben und endet unten.</div></div>
      <div class="case"><h3>Schritt 2: Die Linien müssen sich kreuzen</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Beide Linien sind durchgehend, denn die Wanderin springt nicht. Eine Linie, die von unten nach oben läuft, und eine, die von oben nach unten läuft, müssen sich irgendwo schneiden. Egal wie krumm sie sind und wie viele Pausen es gibt.</div></div>
      <div class="case"><h3>Schritt 3: Antwort</h3>
        <button class="reveal">Schritt zeigen</button><div class="res" hidden>Ja, es gibt immer so eine Stelle, genau am Schnittpunkt. Man kann sich auch zwei Wanderinnen am selben Tag vorstellen, eine geht hoch, eine runter: Sie müssen sich begegnen. Wo genau, kann man ohne weitere Angaben nicht sagen, nur dass es die Stelle gibt.</div></div>

/* ---------- Layout: Simulation und Text nebeneinander ---------- */
// Hat ein Schritt eine Simulation, kommen Canvas + Regler nach links, der Text nach rechts.
// Schritte ohne Canvas bleiben einspaltig mit begrenzter Lesebreite.
function layoutStage(stage){
  const h2=stage.querySelector(':scope > h2');
  const kids=[...stage.children].filter(el=>el!==h2);
  if(!kids.length) return;
  const isViz=el=>el.tagName==='CANVAS'||['ctrl','ctrls','vswitch','modes','btnrow','nav','dots'].some(c=>el.classList.contains(c));
  if(kids.some(el=>el.tagName==='CANVAS')){
    const row=document.createElement('div'); row.className='split';
    const L=document.createElement('div'); L.className='col-viz';
    const R=document.createElement('div'); R.className='col-text';
    kids.forEach(el=>(isViz(el)?L:R).appendChild(el));
    row.appendChild(L);
    if(R.children.length) row.appendChild(R); else L.classList.add('solo');
    stage.appendChild(row);
  } else {
    const one=document.createElement('div'); one.className='col-single';
    kids.forEach(el=>one.appendChild(el));
    stage.appendChild(one);
  }
}

/* ---------- Navigation ---------- */
let i=0;
function buildSteps(){ const box=$('#steps'); box.innerHTML='';
  SECTIONS.forEach((s,k)=>{ const b=document.createElement('button'); b.className='step'+(k===i?' on':'');
    b.innerHTML='<span class="n">'+(k+1)+'</span>'+s.step; b.addEventListener('click',()=>go(k)); box.appendChild(b); });
  // aktiven Abschnitt in die Mitte der Leiste holen
  const on=box.querySelector('.step.on');
  if(on && box.scrollWidth>box.clientWidth){ const r=on.getBoundingClientRect(), rb=box.getBoundingClientRect();
    box.scrollLeft += (r.left+r.width/2)-(rb.left+rb.width/2); }
  stepsRand(); }
// Ausblendung an den Rändern nur dort, wo noch Abschnitte versteckt sind
function stepsRand(){ const box=$('#steps'); if(!box) return; const max=box.scrollWidth-box.clientWidth;
  box.classList.toggle('mehr-l', max>1 && box.scrollLeft>2); box.classList.toggle('mehr-r', max>1 && box.scrollLeft<max-2); }
(function(){ const box=$('#steps'); if(!box) return;
  box.addEventListener('scroll', stepsRand, {passive:true});
  // Mausrad nach unten scrollt die Leiste nach rechts
  box.addEventListener('wheel', e=>{ if(box.scrollWidth<=box.clientWidth || Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
    box.scrollLeft+=e.deltaY; e.preventDefault(); }, {passive:false});
  window.addEventListener('resize', stepsRand); })();
function render(){ stopRAF(); if(window.__stopSound) try{ window.__stopSound(); }catch(_){} const s=SECTIONS[i];
  // Lernziel der Stunde (PAGE.ziel, optional) steht im ersten Schritt ganz oben
  const ziel=(i===0&&PAGE.ziel)?'<div class="box ziel"><span class="lbl">Ziel dieser Stunde</span>'+PAGE.ziel+'</div>':'';
  $('#stage').innerHTML='<h2>'+s.title+'</h2>'+ziel+s.html;
  layoutStage($('#stage'));
  $('#prev').disabled=i===0; $('#next').disabled=i===SECTIONS.length-1;
  buildSteps(); if(s.init) s.init($('#stage')); }
function go(k){ i=Math.max(0,Math.min(SECTIONS.length-1,k)); render(); }
$('#prev').onclick=()=>go(i-1);
$('#next').onclick=()=>go(i+1);
document.title=PAGE.title; $('#h1').textContent=PAGE.h1; render();
</script>
